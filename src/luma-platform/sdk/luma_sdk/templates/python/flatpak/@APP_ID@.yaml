app-id: @APP_ID@
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: run-app
finish-args:
  - --share=ipc
  - --socket=wayland
  - --device=dri
modules:
  - name: luma-developer-platform
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/SimplyLuma/luma.git
        branch: main
  - name: application
    buildsystem: simple
    build-commands:
      - install -Dm755 run-app /app/bin/run-app
      - install -Dm644 src/main.py /app/share/@APP_ID@/main.py
    sources:
      - type: dir
        path: ..
