# Installed as display-manager.service.d/20-luma-app-baseline.conf. Ordering
# only: luma-app-baseline.service reports ready within a bounded wait, and a
# baseline that fails or is still importing never keeps the login screen away.
[Unit]
Wants=luma-app-baseline.service
After=luma-app-baseline.service
