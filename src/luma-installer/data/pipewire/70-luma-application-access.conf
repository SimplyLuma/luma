#
# What an installed application may do on its PipeWire socket.
#
# Installed as /usr/share/wireplumber/wireplumber.conf.d/70-luma-application-access.conf
# by luma-application-installer; see 60-luma-application-socket.conf.
#
# Nothing is visible unless listed here. The application can create its own
# streams (the client-node factory), see the sound outputs to play to and the
# settings a stream needs (rate, quantum, the default output). It cannot see
# microphones, cameras, screen-cast streams or other applications' streams.

access.permission-managers = [
  {
    name = "luma-application"
    default_permissions = "-"
    core_permissions = "rwx"
    rules = [
      {
        matches = [
          { factory.name = "client-node" }
          { metadata.name = "settings" }
          { metadata.name = "default" }
        ]
        actions = { set-permissions = "r" }
      }
      {
        matches = [
          { media.class = "Audio/Sink" }
        ]
        actions = { set-permissions = "rx" }
      }
    ]
  }
]

access.rules = [
  {
    matches = [
      { pipewire.access = "luma-application" }
    ]
    actions = {
      update-props = {
        permission_manager_name = "luma-application"
      }
    }
  }
]

# A sound output has a monitor; without this hook an application could record
# everything the computer plays. See scripts/luma/application-capture.lua.
wireplumber.components = [
  {
    name = luma/application-capture.lua, type = script/lua
    provides = luma.hooks.linking.application-capture
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.linking.standard" }
    ]
    actions = {
      merge = {
        wants = [ luma.hooks.linking.application-capture ]
      }
    }
  }
]
