#
# A PipeWire socket for installed applications.
#
# Installed as /usr/share/pipewire/pipewire.conf.d/60-luma-application-socket.conf
# by luma-application-installer. The capsule launcher mounts
# pipewire-0-application as the application's pipewire-0; the session's own
# pipewire-0 is never handed to an application.
#
# The server marks every client on that socket with the client access
# "luma-application" (pipewire.client.access; a client cannot change it).
# PipeWire gives such a client nothing until the session manager decides, and
# WirePlumber gives it only what 70-luma-application-access.conf lists: it can
# play to the sound outputs and nothing else. Cameras and screens reach an
# application through the portal, which hands it a connection of its own.
#
# The access module keeps its default mode, so clients on pipewire-0 are
# treated as they were without this file: session clients are unrestricted
# at once and Flatpak applications get what WirePlumber gives Flatpak. Naming
# the sockets in module.access.args (access.socket) instead makes every
# client on pipewire-0 wait for the session manager; xdg-desktop-portal
# started while WirePlumber is away then stalls for ten seconds and reports
# no camera until it is restarted.

module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        { name = "pipewire-0-application"
          props = { pipewire.client.access = "luma-application" } }
    ]
}
