#
# A PipeWire socket for installed applications.
#
# Installed as /usr/share/pipewire/pipewire.conf.d/60-luma-application-socket.conf
# by luma-application-installer. The capsule launcher mounts
# pipewire-0-application as the application's pipewire-0; the session's own
# pipewire-0 is never handed to an application.
#
# A client on that socket has the access "luma-application". PipeWire gives
# such a client nothing until the session manager decides, and WirePlumber
# gives it only what 70-luma-application-access.conf lists: it can play to
# the sound outputs and nothing else. Cameras and screens reach an
# application through the portal, which hands it a connection of its own.
#
# Clients on pipewire-0 keep the access "default": WirePlumber gives them
# everything, and Flatpak applications what it gives Flatpak, as before.

module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        { name = "pipewire-0-application" }
    ]
}

module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
        pipewire-0-application = "luma-application"
    }
}
