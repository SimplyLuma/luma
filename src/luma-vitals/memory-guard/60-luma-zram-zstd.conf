# Luma Vitals memory guard (ADR-026 §7): swap on zram, compressed with zstd.
#
# Measured on 262 MiB of real application pages (Messages, its helper and a
# display server) in the kernel's own zram, Fedora 44: zstd stores them in
# 53 MiB, lzo-rle (the kernel default) in 71 MiB and lz4 in 76 MiB, so the
# same RAM holds a third more swapped-out memory.
#
# Size: as much as RAM, up to 16 GiB. Fedora's min(ram, 8192) filled on a
# 32 GiB laptop at 3:1 compression while zram held only 2.2 GiB of RAM, and
# systemd-oomd then stopped apps with 9 GiB of RAM still reclaimable. The size
# is the most zram may hold uncompressed; it costs nothing until used.
[zram0]
zram-size = min(ram, 16384)
compression-algorithm = zstd
