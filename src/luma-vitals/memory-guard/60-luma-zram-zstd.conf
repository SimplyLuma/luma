# Luma Vitals memory guard (ADR-026 §7): compress swap on zram with zstd.
#
# Measured on 262 MiB of real application pages (Messages, its helper and a
# display server) in the kernel's own zram, Fedora 44: zstd stores them in
# 53 MiB, lzo-rle (the kernel default) in 71 MiB and lz4 in 76 MiB, so the
# same RAM holds a third more swapped-out memory. zstd reads back at about
# 890 MiB/s and writes at 260 MiB/s on one core, against 1,590 and 620 for
# lzo-rle: far more than paging needs, and a fuller zram stalls far later.
# The size stays Fedora's: min(ram, 8192) from zram-generator-defaults.
[zram0]
compression-algorithm = zstd
