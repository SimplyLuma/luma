# Luma Vitals memory guard: a soft ceiling for every app.
#
# Applied to every app scope and service (app-*.scope, app-*.service, Flatpak
# and desktop launches alike) and to every container a universal package runs
# in (libpod-*.scope). Past 60% of physical memory an app is reclaimed and
# throttled instead of pushing every other app and the desktop into swap. It
# is a soft limit: nothing is killed here, and Luma Vitals warns the person
# well before an app reaches it.
#
# Named 40- so that a ceiling Luma Vitals sets at run time (systemctl
# set-property writes 50-MemoryHigh.conf) still wins after a daemon-reload:
# drop-ins apply in file-name order, whatever directory they are in.
[Scope]
MemoryHigh=60%
