# Luma Vitals memory guard (ADR-026 §7): when memory and swap are both nearly
# full, systemd-oomd stops the app or background agent holding the most swap,
# instead of the whole desktop thrashing until the kernel's OOM killer picks
# something at random.
#
# Fedora dropped ManagedOOMSwap=kill from its oomd defaults because, set on the
# root slice, it could end a whole login session. Here it is set only on the
# slices that hold apps and background agents, so the candidates are single
# apps; the Shell and session services (session.slice) are never among them.
# systemd-oomd acts only when used memory and used swap both pass
# SwapUsedLimit (90%), which is the point where a desktop with zram stalls.
[Slice]
ManagedOOMSwap=kill
