# Luma: a hard lockup (a CPU stuck with interrupts off, caught by the NMI
# watchdog) means the machine is already unusable. Panic, so the lockup is
# written to pstore (see kargs.d/60-luma-crash-evidence.toml) and archived by
# systemd-pstore on the next boot, and restart after ten seconds instead of
# freezing until the person holds the power button.
kernel.hardlockup_panic = 1
kernel.panic = 10
# Soft lockups are only logged. Under heavy load or in virtual machines they
# can be false positives and often recover, so they never restart anyone's
# machine. A single oops is not escalated either (kernel.panic_on_oops stays 0).
kernel.softlockup_panic = 0
