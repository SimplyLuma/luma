<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.projectluma.BackgroundWake1"/>
  </policy>
  <!-- Anyone may ask; polkit (org.projectluma.background.wake-system) decides. -->
  <policy context="default">
    <allow send_destination="org.projectluma.BackgroundWake1"
           send_interface="org.projectluma.BackgroundWake1"/>
    <allow send_destination="org.projectluma.BackgroundWake1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.projectluma.BackgroundWake1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.projectluma.BackgroundWake1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
