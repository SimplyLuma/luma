# Project Luma Fairphone 6 ALSA transport policy
#
# The Qualcomm AudioReach PCM advertises both MMAP_INTERLEAVED and
# RW_INTERLEAVED access.  On the FP6 kernel path, direct ALSA playback through
# RW_INTERLEAVED advances normally while PipeWire's mmap transport can enter
# RUNNING without advancing the hardware clock.  Restrict this workaround to
# the platform-sound playback node; desktop and non-FP6 audio remain untouched.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-sound.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        api.alsa.period-size = 2400
        api.alsa.period-num = 4
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
