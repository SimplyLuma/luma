# BlueZ's mpris-proxy excludes system users with ConditionUser=!@system, but the
# login screen now runs as a transient greeter user outside that range. There it
# has no players, and it exits with a failure every time the login screen closes
# and takes its bus with it. Run it only in a person's own session.
[Unit]
ConditionEnvironment=XDG_SESSION_CLASS=user
