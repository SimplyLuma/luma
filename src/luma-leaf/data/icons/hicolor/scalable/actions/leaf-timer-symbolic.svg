<!-- Lucide geometry, ISC; adapted to GTK 4.20+ symbolic stroke classes. -->
<svg
  class="lucide lucide-timer"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <line x1="10" x2="14" y1="2" y2="2" class="stroke transparent-fill foreground-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="12" x2="15" y1="14" y2="11" class="stroke transparent-fill foreground-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="12" cy="14" r="8" class="stroke transparent-fill foreground-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
