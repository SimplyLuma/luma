# Luma update agent defaults. Override any key in /etc/luma/update.conf.
[update]
graph_url = https://dl.simplyluma.com/os/graph/{channel}.json
stable_repo_url = https://dl.simplyluma.com/os/repo
preview_repo_url = https://dl.simplyluma.com/os/preview/{credential}/repo
stable_remote = luma
ref_template = luma/1/{arch}/{channel}
events_url = https://hub.simplyluma.com/api/updates/events
preview_credentials_url = https://hub.simplyluma.com/api/updates/preview-credentials
automatic_download = true
minimum_battery_percent = 30
minimum_check_spacing_seconds = 3600
idle_exit_seconds = 300
