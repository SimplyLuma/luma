<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.projectluma.Update1"/>
    <allow send_destination="org.projectluma.Update1"/>
  </policy>
  <!-- Anyone may read state and call methods; every method that changes
       anything is authorized by polkit inside the service, and Automatic
       checks for uid 0. -->
  <policy context="default">
    <allow send_destination="org.projectluma.Update1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.projectluma.Update1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.projectluma.Update1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.projectluma.Update1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.projectluma.Update1" send_interface="org.projectluma.Update1"/>
  </policy>
</busconfig>
