# SPDX-License-Identifier: Apache-2.0
# grub2-tools marks every boot successful two minutes into a session
# (boot_success=1), even one greenboot judged failed, which stops GRUB's
# 08_greenboot.cfg and the phone initramfs from counting down to the previous
# deployment. Where greenboot is installed it alone sets boot_success.
[Unit]
ConditionPathExists=!/usr/lib/systemd/system/greenboot-healthcheck.service
