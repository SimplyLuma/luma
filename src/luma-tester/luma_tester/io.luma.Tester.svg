    <radialGradient id="bloom" cx=".18" cy=".02" r=".9"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#e5ecf2"/><stop offset="1" stop-color="#b6c5d6"/></linearGradient>
