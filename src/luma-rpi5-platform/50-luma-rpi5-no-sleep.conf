# The Raspberry Pi 5 has no working system sleep: after a suspend the Wi-Fi
# chip's SDIO bus does not come back ("failed backplane access over SDIO"),
# USB resume fails and Ethernet gets no lease, leaving the board off the
# network with the screen on. Raspberry Pi OS never suspends either. With
# these off, logind reports CanSuspend=na, so the power menu and the idle
# policy never offer sleep. Installed only by the Pi image.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
