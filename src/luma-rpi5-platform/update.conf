# SPDX-License-Identifier: Apache-2.0
# Raspberry Pi 5 update stream for the shared Luma updater: the Pi image runs
# the Luma Pi kernel, so it follows its own ref and graph, never the generic
# ARM desktop's (Fedora's kernel does not boot on the firmware device tree).
# Installed only by the Pi image.
[update]
hardware_target = raspberrypi,rpi5
ref_template = luma/1/{arch}/raspberrypi-rpi5/{channel}
graph_url = https://dl.simplyluma.com/os/graph/aarch64/raspberrypi-rpi5/{channel}.json
