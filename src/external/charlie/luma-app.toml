schema_version = "0.1"

[application]
id = "org.projectluma.Charlie"
name = "Charlie"
version = "0.2.14"
entrypoint = "data/org.projectluma.Charlie.in"

[platform]
ui_contract = "1"
semantics_contract = "1"

[responsive]
adaptive = true
test_widths = [360, 500, 1024, 1440]
input_modes = ["pointer", "touch", "keyboard"]
presentation_modes = ["windowed", "fullscreen-mobile"]

[portals]
required = ["file-chooser", "open-uri", "notification", "background"]

[background]
agent = "org.projectluma.Charlie.Agent"
exec = "org.projectluma.Charlie --agent"
category = "mail"
wake = ["login", "network", "resume", "schedule"]
publishes = ["unread-count", "unread-by-account", "live-extension:org.projectluma.Charlie.Unread"]

[lifecycle]
data = "~/.local/share/charlie"
cache = "~/.cache/charlie"
reset_supported = true
documents_preserved = true

[conformance]
accessibility = true
keyboard = true
semantics = true
reduced_motion = true
