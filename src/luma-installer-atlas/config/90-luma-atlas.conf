# Anaconda configuration for Luma's installer, installed by luma-installer-atlas.
#
# Atlas tells people "Nothing is sent anywhere" while they choose where they
# are, so the installer must not look up their location over the network.
[Localization]
use_geolocation = False

[Timezone]
geolocation_provider =

[User Interface]
# Atlas runs in Anaconda's slitherer viewer (a Qt Quick window with a Qt
# WebEngine view), started and watched by atlas-viewer from webui-desktop.
webui_web_engine = slitherer
