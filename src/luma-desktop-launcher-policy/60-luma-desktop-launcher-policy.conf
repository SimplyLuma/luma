# Desktop-only, immutable XDG overrides; retain caller data directories.
XDG_DATA_DIRS=/usr/share/luma/desktop-overrides:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}

# Keep Fedora-owned user profile intact; select the Luma profile for the session.
DCONF_PROFILE=luma

# Electron still defaults to X11, so an Electron application that says nothing
# runs through XWayland: every frame composited twice, no fractional scaling,
# and the window server doing work no one asked for. On this desktop, measured
# 2026-09-20, one of the four Chromium-family applications running had taken
# that default and none of them had asked for it. "auto" picks Wayland when the
# session is Wayland and X11 when it is not, and an application that sets
# --ozone-platform on its own command line still wins, so nothing that already
# made a choice is overridden.
ELECTRON_OZONE_PLATFORM_HINT=auto
