# SPDX-License-Identifier: CC0-1.0
# Cisco's OpenH264 binary. Luma never builds or redistributes it: each device
# downloads this exact file from Cisco (luma-openh264 on the OS, flatpak extra
# data for org.projectluma.Platform.openh264), which is what Cisco's patent
# coverage requires (https://www.openh264.org/BINARY_LICENSE.txt). The version
# matches the headers Fedora's gstreamer1-plugin-openh264 and noopenh264 are
# built against; update all three together. Plain KEY=value lines.
OPENH264_VERSION=2.6.0
OPENH264_SONAME=libopenh264.so.8
# The Flatpak runtime branch the extension belongs to.
OPENH264_FLATPAK_BRANCH=44

OPENH264_X86_64_URL=https://ciscobinary.openh264.org/libopenh264-2.6.0-linux64.8.so.bz2
OPENH264_X86_64_SIZE=634264
OPENH264_X86_64_SHA256=27ab53323c110b76214c1c72222f459d17febbcd1e252136cadc292b0308d75b
OPENH264_X86_64_LIBRARY_SHA256=2f0cde7c6a6abcf5cae76942894ea42897fa677bce4ed6c91a24dd1b041d5f04

OPENH264_AARCH64_URL=https://ciscobinary.openh264.org/libopenh264-2.6.0-linux-arm64.8.so.bz2
OPENH264_AARCH64_SIZE=619371
OPENH264_AARCH64_SHA256=a78aea7970150f46bcd3bb7994c9e6dd90bd7a9ea785920f5a73f6964e3fcda7
