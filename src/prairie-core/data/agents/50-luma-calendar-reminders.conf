# drop-in: /usr/lib/systemd/user/evolution-alarm-notify.service.d
# Luma Calendar's reminders agent (prairie-calendar --agent)
# shows calendar reminders. evolution-alarm-notify would act on the same
# reminders — advance each calendar's last-notified time, rewrite the shared
# past/snoozed lists, auto-dismiss audio alarms on the server — and show its
# own GTK 3 notifications, so every reminder would appear twice. A user who
# wants it back overrides this with an empty ConditionPathExists= in a drop-in
# of their own.
[Unit]
ConditionPathExists=!/usr/share/luma/background/org.projectluma.Calendar.toml
