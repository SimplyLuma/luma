<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- imsd (userspace VoLTE daemon) system-bus policy.
     Install: /usr/share/dbus-1/system.d/net.catcrafts.IMS1.conf -->
<busconfig>
  <policy user="root">
    <allow own="net.catcrafts.IMS1"/>
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <!-- Any local account may reach imsd: the dialer shim runs as the session
       account, whatever it is called. imsd itself decides who may place,
       answer or end a call — polkit's net.catcrafts.IMS1.Voice
       (net.catcrafts.IMS1.policy: the active local session). Owning the name
       stays root's. -->
  <policy context="default">
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
</busconfig>
