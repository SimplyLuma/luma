<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- imsd-ofonod system-bus policy: imsd presented as an oFono modem, which is
     the seam GNOME Calls' bundled `ofono` provider plugin drives.
     Install: /usr/share/dbus-1/system.d/imsd-ofono.conf

     Deliberately NOT named org.ofono.conf on disk: the real oFono package
     ships that filename, and the two must not silently overwrite each other.
     They cannot run together in any case — one org.ofono name, one owner. -->
<busconfig>
  <policy user="root">
    <allow own="org.ofono"/>
    <!-- imsd (root) reaches this daemon only by broadcast signals, and
         dbus-broker checks a broadcast against the sender's send policy for
         every name the receiver owns (dbus-daemon does not). The default
         below allows sending too since 0.3.10; this line stays so that a
         tighter default can never again silently drop every CallAdded /
         CallStateChanged from imsd on the way to imsd-ofonod, as the old
         default deny did (found on the FP6, 2026-09-20). -->
    <allow send_destination="org.ofono"/>
  </policy>
  <!-- Any local account's GNOME Calls may reach imsd-ofonod, whatever the
       session account is called; imsd-ofonod asks polkit before call control
       (net.catcrafts.IMS1.Voice, as imsd does). Owning the name stays
       root's. -->
  <policy context="default">
    <deny own="org.ofono"/>
    <allow send_destination="org.ofono"/>
    <allow receive_sender="org.ofono"/>
  </policy>
</busconfig>
