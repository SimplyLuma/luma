# SPDX-License-Identifier: MPL-2.0
# rpm -i/-U of a package file on Luma installs it into the system image, live,
# like sudo dnf install (ADR-038). /usr/local/bin comes before /usr/bin in
# every search path, sudo's included; an existing /usr/local/bin/rpm is kept.
# /usr/local and /opt are the writable, persistent homes for software that
# installs itself (they are /var/usrlocal and /var/opt).
d /var/usrlocal 0755 root root -
d /var/usrlocal/bin 0755 root root -
d /var/opt 0755 root root -
L /var/usrlocal/bin/rpm - - - - /usr/libexec/luma-install-commands/rpm
