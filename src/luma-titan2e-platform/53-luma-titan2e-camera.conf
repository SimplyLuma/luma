# Titan 2 Elite: the raw Bayer capture node is reached through libcamera
# ("Built-in Back Camera"); do not offer it as a plain V4L2 camera.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "v4l2_device.platform-1a00e000.camera-capture" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
