# The Titan 2 Elite boots one slot from the microSD card (no qbootctl A/B):
# its own health check replaces greenboot's FP6 backend. luma-titan2e-boot-ok
# (the LK slot) and luma-titan2e-boot-bless (the OSTree deployment) run only
# after it passes.
[Service]
ExecStart=
ExecStart=/usr/libexec/luma-titan2e-healthcheck
TimeoutStartSec=300
