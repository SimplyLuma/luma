# Titan 2 Elite (ALSA card Titan2Elite): idle nodes suspend so the speaker
# amplifier powers down. The speaker and the earpiece are ports of one sink;
# UCM priorities put media on the speaker and calls on the earpiece.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "Titan2Elite" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
