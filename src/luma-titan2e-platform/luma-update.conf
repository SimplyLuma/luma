# Titan 2 Elite platform policy for the shared Luma updater (as the FP6's).
# The composed OSTree origin selects nightly initially; channel changes remain
# owned by SetChannel. %config(noreplace): administrator edits are kept.
[update]
hardware_target = unihertz,titan2e
ref_template = luma/1/{arch}/unihertz-titan2e/{channel}
graph_url = https://dl.simplyluma.com/os/graph/aarch64/unihertz-titan2e/{channel}.json
automatic_download = true
