<busconfig>
  <policy user="root">
    <allow own="org.projectluma.Titan2e.Modem1"/>
    <allow send_destination="org.projectluma.Titan2e.Modem1"/>
  </policy>
  <policy context="default"><deny send_destination="org.projectluma.Titan2e.Modem1"/></policy>
</busconfig>
