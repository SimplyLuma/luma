SectionVerb {
	# DPCM front ends refuse to open without a connected back end,
	# so the AFE routes stay on; devices switch the outputs/inputs.
	# DL0 feeds both the codec (earpiece) and the speaker amp, so the
	# earpiece and the speaker are ports of one sink.
	EnableSequence [
		cset "name='I2SOUT4_CH1 DL0_CH1' on"
		cset "name='I2SOUT4_CH2 DL0_CH2' on"
		cset "name='ADDA_DL_CH1 DL0_CH1' on"
		cset "name='ADDA_DL_CH2 DL0_CH2' on"
		cset "name='DAC In Mux' Normal Path"
		cset "name='UL0_CH1 ADDA_UL_CH1' on"
		cset "name='UL0_CH2 ADDA_UL_CH2' on"
		cset "name='AIF Out Mux' Normal Path"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RCV Mux' Voice Playback"
		cset "name='Handset Volume' 12"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='RCV Mux' Open"
		cset "name='Earpiece Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA1 Volume' 2"
		cset "name='Main Mic Switch' on"
	]

	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='Main Mic Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
