SectionVerb {
	# Voice runs between the modem (AFE PCM 1) and the codec without the CPU.
	# luma-titan2e-speech turns modem speech on and holds the hostless speech
	# PCM (device 3) open, which powers the path, while this verb is active.
	# The devices keep the HiFi PCMs for tones and prompts during a call.
	EnableSequence [
		cset "name='DAC In Mux' Normal Path"
		cset "name='AIF Out Mux' Normal Path"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' on"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' on"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' on"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' on"
		exec "/usr/libexec/luma-titan2e-speech on"
	]

	DisableSequence [
		exec "/usr/libexec/luma-titan2e-speech off"
		cset "name='ADDA_DL_CH1 PCM_1_CAP_CH1' off"
		cset "name='ADDA_DL_CH2 PCM_1_CAP_CH1' off"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' off"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH2' off"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RCV Mux' Voice Playback"
		cset "name='Handset Volume' 12"
		cset "name='Earpiece Switch' on"
		exec "/usr/libexec/luma-titan2e-speech device earpiece"
	]

	ConflictingDevice [
		"Speaker"
	]

	DisableSequence [
		cset "name='RCV Mux' Open"
		cset "name='Earpiece Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	# the speaker amp runs from I2SOUT4 at 48 kHz, the call rate
	EnableSequence [
		cset "name='I2SOUT4_CH1 PCM_1_CAP_CH1' on"
		cset "name='I2SOUT4_CH2 PCM_1_CAP_CH1' on"
		cset "name='Speaker Switch' on"
		exec "/usr/libexec/luma-titan2e-speech device speaker"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='I2SOUT4_CH1 PCM_1_CAP_CH1' off"
		cset "name='I2SOUT4_CH2 PCM_1_CAP_CH1' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA1 Volume' 2"
		cset "name='Main Mic Switch' on"
	]

	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='Main Mic Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
