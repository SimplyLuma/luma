# SPDX-License-Identifier: MPL-2.0
#
# Project Luma sound output policy for WirePlumber 0.5.
#
# Installed as /usr/share/wireplumber/wireplumber.conf.d/60-luma-audio-policy.conf
# by luma-audio-policy. It adds hooks to the stock default-node selection and
# declares one retired setting. It changes no stock
# setting and does not replace any upstream script, so a person's own
# fragments in /etc/wireplumber or ~/.config/wireplumber keep working.
#
# To turn the Luma rules off for one account, add a fragment in
# ~/.config/wireplumber/wireplumber.conf.d/ with:
#   wireplumber.profiles = { main = { luma.hooks.default-nodes.output-policy = disabled } }

wireplumber.settings.schema = {
  # Retired with the new-device prompts (luma-audio-policy 1.luma.3). Still
  # declared so luma-audio-devices can remove values saved by 1.luma.1-2.
  luma.audio.manual-only-outputs = {
    name = "Retired: outputs used only when chosen"
    description = "No longer read. luma-audio-devices removes the value saved by earlier versions"
    type = "array"
    default = []
  }
}

wireplumber.components = [
  {
    name = luma/output-policy.lua, type = script/lua
    provides = luma.hooks.default-nodes.output-policy
    requires = [ metadata.default ]
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.default-nodes" }
    ]
    actions = {
      merge = {
        wants = [ luma.hooks.default-nodes.output-policy ]
      }
    }
  }
]
