#
# Project Luma: AirPlay receivers are sound outputs only when the person picks
# them.
#
# Installed as /usr/share/pipewire/pipewire.conf.d/40-luma-network-audio-opt-in.conf
# by luma-audio-policy. Fedora's pipewire-config-raop loads
# libpipewire-module-raop-discover whenever module.raop is not false, which
# turns every Mac with AirPlay Receiver enabled on the network into an output.
# Luma leaves the module installed and switches automatic discovery off;
# luma-audio-devices browses for receivers only while the "AirPlay Speakers"
# picker is open and creates a sink only for a receiver the person chose.
#
# To bring back automatic discovery for one account, create
# ~/.config/pipewire/pipewire.conf.d/60-raop-discover.conf containing
#   context.properties = { module.raop = true }
# and restart PipeWire. Luma still never makes those outputs the default on its
# own (see /usr/share/wireplumber/wireplumber.conf.d/60-luma-audio-policy.conf).

context.properties = {
    module.raop = false
}
