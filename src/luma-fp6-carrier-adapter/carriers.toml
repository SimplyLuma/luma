# SPDX-License-Identifier: Apache-2.0
# FP6 carrier table read by luma-fp6-carrier-select (packaged in
# luma-fp6-carrier-adapter as /usr/share/luma/fp6-carriers/carriers.toml).
#
# networks:        MCC+MNC strings the row applies to
# spn/gid1_prefix: optional SIM match; a matching row beats a plain network row
# mcfg:            factory | tmo-qrel1695 | att-qrel1695 (modem software config)
# apn:             data APN; omit to use mobile-broadband-provider-info, or set
#                  apn_from_network = true to use the modem's attach APN
# allowed_modes:   "" | "4g" | "4g,5g"
# verified:        true only after physical acceptance on an FP6 with that SIM
#
# Networks without a row get the factory modem profile and their APN from
# mobile-broadband-provider-info. That covers the EU, unverified.

[[carrier]]
name = "Tello (T-Mobile US network)"
networks = ["310240", "310260"]
gid1_prefix = "6941"   # read from a Tello eSIM on an FP6 (2026-10-16); Tello sets no EF_SPN
mcfg = "tmo-qrel1695"
apn = "wholesale"
allowed_modes = "4g"   # outgoing SMS fails on 5G (fp6-esim-backend.md)
volte = "unverified"
verified = true        # data and SMS on Nick's FP6
note = "Known-good reference: tmo-qrel1695, APN wholesale, LTE only."

[[carrier]]
name = "T-Mobile US"
networks = ["310260", "310160", "310200", "310210", "310220", "310230", "310240",
            "310250", "310270", "310310", "310490", "310660", "310800"]
mcfg = "tmo-qrel1695"
apn_from_network = true
allowed_modes = "4g"
volte = "unverified"
verified = false
note = "T-Mobile modem profile; APN from the network. MVNOs that need their own APN need a row."

[[carrier]]
name = "AT&T"
networks = ["310410", "310150", "310170", "310280", "310380", "310560", "310680", "313100"]
mcfg = "att-qrel1695"
apn_from_network = true
volte = "unverified"
verified = false
note = "AT&T modem profile when its file is installed; APN from the network."

[[carrier]]
name = "Verizon"
networks = ["311480", "310004", "310012"]
mcfg = "factory"
apn = "vzwinternet"
volte = "no"
verified = false
note = "No Verizon modem profile exists for the FP6: data at best, no VoLTE calls."
