# SPDX-License-Identifier: Apache-2.0
schema = 1
vendor = "fairphone"
codename = "fp6"
name = "Fairphone (Gen. 6)"
marketing_name = "Fairphone 6"
form_factor = "phone"
year = 2025
soc = "qcom/milos"
tier = "supported"
maintainers = ["@nmcmil"]
fastboot_product = "FP6"

[kernel]
tag = "luma-fp6-alpha1-7.1.2-luma-fp-ims1.gmu2.selinux1"
release = "7.1.2-luma-fp-ims1.gmu2.selinux1"
config = "luma/fp6/alpha1/config-7.1.2-luma-fp-ims1.gmu2.selinux1"
dtb = "qcom/milos-fairphone-fp6.dtb"
dtb_overlays = "luma/fp6/alpha1/dtb"

[boot]
config = "boot.toml"

[initramfs]
# The boot image's ramdisk is three concatenated cpio archives; the kernel
# unpacks them in order and later files replace earlier ones.
#  1-2: postmarketOS edge initramfs (postmarketos-initramfs 3.12.0-r0), unmodified.
#  3:   Luma overlay: init_functions.sh, Luma kernel modules, ostree-prepare-root
#       with its Fedora 44 libraries, and the boot theme.
ramdisk_sha256 = "944489269addf33f8cd5e8f305ccc368573396e26df03dc6ea63970242659a82"
base = "postmarketos-initramfs 3.12.0-r0"
init_functions = "scripts/mobile/fp6-native-init-functions.sh"
init_functions_sha256 = "64bbcd91dbdc0c6956cf79e40ad580ed089494b646acf824138ba57b6f997f4c"
ostree_package = "ostree-2026.5-1.luma.2.fc44"
ostree_source = "config/mobile/fp6-ostree-source.json"

[firmware]
manifest = "firmware.manifest"
manifest_sha256 = "79a3c9b336f43dc341953426f1e8fc1ebf6c07d24a997dfe5c04370f31c80d7b"
files = 267
# Where the OS keeps it on the phone: shared /var, outside the signed /usr.
store = "/var/lib/luma/device-firmware"

[install]
guide = "INSTALL.md"
method = "fastboot"
# Partitions the install must never erase or write. modemst1/modemst2 hold the
# phone's own modem settings, including its IMEI.
preserve = ["modemst1", "modemst2", "fsg", "fsc", "persist"]

[updates]
ostree_ref = "luma/1/aarch64/fairphone-fp6/nightly"

[imager]
# What Luma Imager shows and does for this phone (docs/imager-catalog.md).
# never_write comes from [install].preserve; the release from [[releases]].
status = "available"
method = "fastboot_bundle"
summary = "Alpha 1, an early release. Installing it erases everything on the phone."
needs = [
  "A USB-C data cable",
  "Android platform tools (fastboot) 35 or newer",
  "About 20 GB of free space on the computer",
  "A backup of everything on the phone",
  "A physical SIM card; eSIM setup isn't available in Alpha 1",
  "The newest Fairphone 6 factory package from Fairphone",
]

[[imager.guide]]
title = "Back up the phone"
body = "Installing Luma erases everything on the phone. Back up anything you want to keep first."

[[imager.guide]]
title = "Unlock the bootloader"
body = "Follow Fairphone's unlocking instructions: turn on Developer options and OEM unlocking, get your unlock code from Fairphone, then run fastboot flashing unlock and fastboot flashing unlock_critical. Unlocking erases the phone."

[[imager.guide]]
title = "Install Fairphone's firmware"
body = "Unzip the newest Fairphone 6 factory package. Before you run its flash script, remove the script's two erase modemst lines, and the script's own line in SHA256SUMS. Those lines erase the modem settings, where the phone's IMEI lives. Then run the script as Fairphone describes."

[[imager.guide]]
title = "Let Android save the modem settings"
body = "When Android starts, finish its setup, connect to Wi-Fi and turn on your SIM. Wait for signal, use mobile data for a couple of minutes, restart Android once, then turn the phone off. Without this, calls and mobile data won't work in Luma."

[[imager.guide]]
title = "Open the Fastboot screen"
body = "Hold Volume Down, then press Power, and keep holding until the Fastboot screen appears. Connect the phone to the computer with the data cable."

[[imager.guide]]
title = "Install Luma"
body = "Imager checks that the phone reports FP6 and slot a, then writes Luma to userdata, boot_a and boot_b and blanks dtbo_a and dtbo_b. Writing userdata takes about ten minutes. Don't unplug the phone. Imager never writes modemst1, modemst2, fsg, fsc or persist."

[[imager.guide]]
title = "First start"
body = "Imager starts Luma's first boot with fastboot boot, never fastboot reboot: a normal first restart lets the bootloader erase the modem settings and the IMEI. The first start takes a minute or two. Sign in as luma with the password 1234, then change the password in Settings."

