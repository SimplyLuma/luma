<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Fold IMS1 bridge policy, based on scripts/mobile/net.catcrafts.IMS1-luma.conf.
     Install: /usr/share/dbus-1/system.d/net.catcrafts.IMS1.conf -->
<busconfig>
  <policy user="root">
    <allow own="net.catcrafts.IMS1"/>
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <policy user="luma">
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <!-- the phone's owner (dbus-broker ignores at_console) -->
  <policy group="wheel">
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <!-- whoever is logged in on the local seat -->
  <policy at_console="true">
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <policy user="greetd">
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="DialEmergency"/>
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="HangUpEmergency"/>
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="GetEmergencyCallState"/>
  </policy>
  <policy context="default">
    <deny send_destination="net.catcrafts.IMS1"/>
  </policy>
</busconfig>
