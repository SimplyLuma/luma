<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- luma-fold-mobile-mode: anyone may read the mode and ask for a switch;
     the service checks polkit (NetworkManager enable-disable-wwan) itself. -->
<busconfig>
  <policy user="root">
    <allow own="org.projectluma.MobileMode1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.projectluma.MobileMode1" send_interface="org.projectluma.MobileMode1"/>
    <allow send_destination="org.projectluma.MobileMode1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.projectluma.MobileMode1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
