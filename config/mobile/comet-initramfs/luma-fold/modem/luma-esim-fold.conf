# luma-esim on the Fold: the eUICC sits behind the SIT modem, so the broker
# reaches it through sit-lpa (sit-proxy) instead of ModemManager's owned FD.
# Install: /run/systemd/system/luma-esim.service.d/50-luma-fold-sit.conf
[Service]
Environment=LUMA_ESIM_TRANSPORT=sit
Environment=LUMA_ESIM_SIT_LPA=/var/lib/luma-fold/modem-stack/usr/bin/sit-lpa
Environment=LUMA_ESIM_SWITCH_UNIT=luma-fold-esim-switch.service
# broker threads + sit-lpa + relay + lpac (curl resolver)
TasksMax=16
