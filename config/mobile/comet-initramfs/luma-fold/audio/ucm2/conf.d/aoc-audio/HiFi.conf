# aoc-audio: playback to the AOC (PCM 0, stereo 48 kHz), capture from the
# AOC's microphone path (PCM 1). The two CS35L41 amplifiers run their Halo DSP
# speaker-protection firmware; the DSP is preloaded here so a firmware failure
# shows in the journal at boot. Gains: the analog gain is the stock speaker
# setting (17: AMP PCM Gain in the vendor mixer paths, which the protection
# tuning assumes); the digital volume is capped at -12 dB for bring-up (817 is
# 0 dB, 0.125 dB per step). The earpiece shares this PCM and is an amplifier
# setup (left amp alone, DSP bypassed), applied by luma-fold-callaudio.

SectionVerb {
	EnableSequence [
		cset "name='DSP1 Preload Switch' 1"
		cset "name='R DSP1 Preload Switch' 1"
		cset "name='PCM Source' DSP"
		cset "name='R PCM Source' DSP"
		cset "name='Analog PCM Volume' 17"
		cset "name='R Analog PCM Volume' 17"
		cset "name='Digital PCM Volume' 721"
		cset "name='R Digital PCM Volume' 721"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

# Never selected as a profile (Speaker carries the higher priority, and nothing
# switches to it): it is here because callaudiod only takes a card that has an
# earpiece port. The earpiece itself is an amplifier setup applied by
# luma-fold-callaudio on the speaker sink, so the sink is never swapped.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='R Digital PCM Volume' 0"
		cset "name='PCM Source' ASP"
		cset "name='Analog PCM Volume' 6"
		cset "name='Digital PCM Volume' 817"
	]

	DisableSequence [
		cset "name='Digital PCM Volume' 721"
		cset "name='PCM Source' DSP"
		cset "name='Analog PCM Volume' 17"
		cset "name='R Digital PCM Volume' 721"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
