# Barbet: the SM7250 LPASS TDM link is 16-bit. PipeWire otherwise negotiates
# S24_LE, which starts the ADSP backend at the wrong slot width and produces
# silence on both the speaker and the microphone. Pin both nodes to S16.
#
# The speaker runs at 48 kHz, but the RT5514P capture front end only returns
# audio at 32 kHz (the kernel pins the capture PCM to that rate), so the
# microphone must be opened at 32 kHz as well.
#
# The card profile set is set here as well as in the udev rule: the ALSA
# monitor can create the device before the udev property is visible, which
# leaves the card without a speaker sink.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        device.profile-set = "/etc/alsa-card-profile/mixer/profile-sets/barbet.conf"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.speaker" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.microphone" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 32000
      }
    }
  }
]
