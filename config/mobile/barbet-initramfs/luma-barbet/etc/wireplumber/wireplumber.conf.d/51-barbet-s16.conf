# Barbet: the SM7250 LPASS TDM link is 16-bit. PipeWire otherwise negotiates
# S24_LE, which starts the ADSP backend at the wrong slot width and produces
# silence on both the speaker and the microphone. Pin both nodes to S16.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.speaker" }
      { node.name = "alsa_input.platform-sound.microphone" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
