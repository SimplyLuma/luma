[Service]
# Several otherwise-valid GTK applications omit the completion input hint.
# Stevia still suppresses completion for password, PIN, terminal, URL, email,
# phone, and numeric purposes, so enabling the normal-text completion surface
# here does not weaken its sensitive-field boundary.
Environment=POS_DEBUG=force-completion
ExecStart=
ExecStart=/usr/local/libexec/luma-phosh-osk-stevia --allow-replacement
