[Service]
# The FP6 camera stack currently uses libcamera's Simple pipeline.  Keep its
# software ISP off the Adreno GPU until the A810 userspace/kernel path can stop
# and tear down EGL processing without hanging videobuf2 release.
Environment=LIBCAMERA_SOFTISP_MODE=cpu

# A failed camera stream must not enter systemd's SIGABRT/core-dump stop path:
# that can freeze a second thread while it owns a videobuf2 queue lock and turn
# a recoverable userspace failure into an unkillable D-state task.
TimeoutStopSec=15s
TimeoutStopFailureMode=kill
LimitCORE=0
