# FP6 platform policy for the shared Luma updater. The composed OSTree origin
# selects nightly initially; channel changes remain owned by SetChannel.
# Package as %config(noreplace); retain administrator edits across upgrades.
# This overlays the shared updater vendor defaults without file-owner conflicts.
[update]
hardware_target = fairphone,fp6
ref_template = luma/1/{arch}/fairphone-fp6/{channel}
graph_url = https://dl.simplyluma.com/os/graph/aarch64/fairphone-fp6/{channel}.json
automatic_download = true
