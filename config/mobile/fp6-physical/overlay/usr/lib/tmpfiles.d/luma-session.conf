#
# The native locked Phosh session starts at boot through greetd and owns the
# user's graphical services for the life of the phone. Remove the former linger
# marker: a pre-login user manager can otherwise start Phosh independently and
# create a second shell/compositor before greetd establishes the real session.
d /var/lib/systemd/linger 0755 root root -
r /var/lib/systemd/linger/luma - - - -
