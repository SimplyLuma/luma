Syntax 4

SectionUseCase."HiFi" {
	File "/Fairphone/fp6/HiFi.conf"
	Comment "Fairphone 6 speakers"
}

# Keep both amplifiers physically attenuated until PipeWire selects a route.
# Individual SectionDevice enable sequences establish their calibrated level.
BootSequence [
	cset "name='Amplifier L PCM Playback Volume' 0"
	cset "name='Amplifier R PCM Playback Volume' 0"
]
