[terminal]
vt = 1
switch = true

[general]
source_profile = true

# One-shot physical-compositor Lomiri Keyboard comparison. The live config is
# restored to Luma immediately after greetd starts this authenticated session.
[initial_session]
command = "/usr/local/bin/luma-lomiri-direct-session"
user = "luma"

[default_session]
command = "agreety --cmd /usr/local/bin/luma-shell-session"
user = "greetd"
