# Project Luma Recent internal update endpoint.
# Bound to loopback deliberately; enrolled clients reach it through a
# per-device, forwarding-only SSH tunnel.

worker_processes 1;
pid /run/luma-recent-nginx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    access_log off;
    sendfile on;
    client_body_temp_path /run/luma-recent-nginx/client_body;
    proxy_temp_path /run/luma-recent-nginx/proxy;
    fastcgi_temp_path /run/luma-recent-nginx/fastcgi;
    uwsgi_temp_path /run/luma-recent-nginx/uwsgi;
    scgi_temp_path /run/luma-recent-nginx/scgi;

    server {
        listen 127.0.0.1:8443 ssl;
        server_name 127.0.0.1;

        ssl_certificate /etc/luma/recent-tls/server.crt;
        ssl_certificate_key /etc/luma/recent-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:LumaRecentTLS:1m;
        ssl_session_timeout 10m;

        location = /health {
            default_type text/plain;
            return 200 "luma-recent\n";
        }

        location /luma/repo/ {
            alias /srv/luma-build/updates/webroot/current/;
            autoindex off;
            limit_except GET HEAD { deny all; }
        }

        # The Depot catalogue, beside the repository it belongs with, so that
        # listing an application is publishing a file rather than rebuilding
        # the operating system and rebooting into it. The catalogue is
        # discovery metadata only: what a client is willing to install from is
        # decided by the allow-list compiled into luma_installer, which no
        # document served from here can widen.
        location /luma/depot/ {
            alias /srv/luma-build/updates/webroot/depot/;
            autoindex off;
            default_type application/json;
            limit_except GET HEAD { deny all; }
        }

        location / {
            return 404;
        }
    }
}
