[network]
# pasta expects its network namespace under a conventional /run/user tree.
# The isolated builder deliberately keeps runtime state below /srv/luma-build,
# so use the supported slirp4netns backend instead.
default_rootless_network_cmd = "slirp4netns"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
tmp_dir = "/srv/luma-build/tmp/podman"
