# The packaged unit only Wants dev-binderfs.mount, which expresses a dependency
# and no ordering at all, so the container can start before binderfs is there.
# Its ExecStartPre then links /dev/binderfs/* into /dev against nothing, and
# Android comes up far enough to crash-loop zygote instead of failing cleanly.
[Unit]
After=dev-binderfs.mount

# zygote dies with 'createProcessGroup(0, N) failed: Read-only file system'
# because Android wants to make its own cgroups underneath this unit's, and an
# undelegated cgroup subtree is read-only to everything but systemd.
[Service]
Delegate=yes
