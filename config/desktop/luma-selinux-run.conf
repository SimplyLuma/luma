# PID 1 writes /run/systemd/default-hostname through a temporary file, so the
# policy's name-based transition to hostname_etc_t never applies and the file
# keeps init_var_run_t. A systemd initramfs hides this (its copy is relabeled
# when the policy loads); a phone's busybox initramfs does not, and
# systemd-hostnamed is then refused removing the file when the computer is
# named. Restore the label from file_contexts.
z /run/systemd/default-hostname - - - -
