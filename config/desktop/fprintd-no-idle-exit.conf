# fprintd exits when it has been unused for a short period. GDM runs its
# fingerprint conversation alongside the password one, so after the machine has
# been asleep the first unlock pays for D-Bus activating the daemon and opening
# the reader. Two things went wrong because of it: a typed password sat on a
# spinner until that finished or the user cancelled, and the greeter often
# settled into password-only before fingerprint became available, so "or touch
# finger" never appeared.
#
# Keeping the daemon resident takes that cold start off the unlock path without
# disabling fingerprint authentication or touching the PAM stack.
[Service]
ExecStart=
ExecStart=/usr/libexec/fprintd --no-timeout
