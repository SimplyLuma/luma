# Project Luma system-wide GTK 3 default. Installed to /etc/gtk-3.0/settings.ini
# during image composition (never to a per-user config).
#
# gtk-error-bell=0 turns off GtkSettings:gtk-error-bell, the property
# gtk_widget_error_bell() checks before calling gdk_window_beep() (for example
# when Backspace is pressed in an empty GtkEntry, or any other refused text
# action). With it off, GTK never asks for a beep, so nothing downstream ever
# plays the freedesktop "bell" sound. This is an unlocked default: a person
# can still turn error bells back on in their own
# $XDG_CONFIG_HOME/gtk-3.0/settings.ini.
[Settings]
gtk-error-bell=0
