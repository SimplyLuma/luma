# Luma desktop Bluetooth audio roles (ADR-021, docs/decisions/021-luma-connect-android-companion.md).
#
# PipeWire's bluez5 monitor, which runs inside WirePlumber, enables the HFP
# Hands-Free role (hfp_hf) and its org.pipewire.Telephony D-Bus service by
# default. A stock computer would then offer itself as a car-kit-style
# hands-free unit to every bonded phone, and Android makes the most recently
# connected hands-free device its active call device. Luma turns both off.
# Luma Connect writes ~/.config/wireplumber/wireplumber.conf.d/90-luma-connect-calls.conf
# for one person's paired phone when they choose calls on this computer; user
# fragments load after this one and override it.
#
# WirePlumber appends arrays from later fragments, so the full list is given
# with the override. prefix (WirePlumber 0.5 docs,
# docs/rst/daemon/configuration/modifying_configuration.rst). The list keeps
# every other PipeWire 1.6 default role: A2DP, LE Audio (BAP and broadcast),
# ASHA hearing aids and the Audio Gateway role that headsets need.
# bluez5.codecs is left unset on purpose.
#
# Install as /etc/wireplumber/wireplumber.conf.d/60-luma-bluetooth-roles.conf.
monitor.bluez.properties = {
  override.bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source bap_bcast_sink bap_bcast_source asha_sink hfp_ag ]
  bluez5.telephony-dbus-service = false
}
