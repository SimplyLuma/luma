#
# Luma: keep the firmware logo on screen from power-on to the boot splash.
#
# bootupd writes /boot/grub2/grub.cfg at install time from the static pieces in
# /usr/lib/bootupd/grub2-static, in name order. Its preamble shows GRUB's text
# menu for one second on every boot, which clears the firmware's logo, draws a
# menu and blanks again before Plymouth puts the logo back. This piece runs
# after the preamble and does what Fedora's menu_auto_hide does on a machine
# whose last boot was fine: the menu stays hidden, and for that second Esc, F8
# or a held Shift still opens it. GRUB draws nothing while hidden, so the
# firmware's image stays up until the kernel's framebuffer takes it over.
#
# - 14_menu_show_once runs after this and still shows the menu when asked
#   (grub2-editenv - set menu_show_once_timeout=N).
# - 08_greenboot still counts failed boots and falls back to the previous
#   deployment by itself; that needs no menu.
set timeout_style=hidden
set timeout=1
