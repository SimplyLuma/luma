# The graphical terminal sets a video mode and clears the screen, which would
# wipe the firmware logo on a boot whose menu stays hidden. Only switch to it
# when the menu is going to be drawn; a menu opened from the hidden countdown
# (Esc, F8, Shift) uses the firmware console instead.
if [ "${timeout_style}" != "hidden" ]; then
  insmod all_video
  insmod gfxterm
  insmod gfxmenu

  loadfont $prefix/themes/luma/prairie-12.pf2
  loadfont $prefix/themes/luma/prairie-22.pf2
  if loadfont $prefix/themes/luma/prairie.pf2; then
    terminal_output gfxterm
  fi
fi

set color_normal=dark-gray/white
set color_highlight=white/blue

if [ -f $prefix/themes/luma/theme.txt ]; then
  set theme=$prefix/themes/luma/theme.txt
fi

# Keep Fedora's generated BLS data authoritative. Fedora Atomic names these
# by OSTree deployment and does not mark one with GRUB's upstream
# `--show-default` metadata, so filtering can hide every bootable entry.
blscfg

submenu 'Show advanced startup options' --class advanced --id luma-advanced {
  # This is an explicit secondary view of the real rollback-preserving BLS
  # inventory, never a hand-maintained or simulated boot list.
  blscfg
}

# UEFI owns boot-device selection. Expose its setup surface only on firmware
# that advertises the standard GRUB fwsetup action.
if fwsetup --is-supported; then
  menuentry 'Boot device and firmware settings' --class firmware --id luma-firmware {
    fwsetup
  }
fi
