[runtime]
engine=waydroid
multi_window=true
start_when_apps_installed=true
idle_freeze=false
apk_max_bytes=2147483648

[privacy]
share_home=false
share_contacts=false
share_calendars=false
share_location=false
share_microphone=false
share_camera=false

[images]
# Release composition must replace these development channels with pinned,
# hashed image artifacts before Android compatibility can ship.
system_channel=https://ota.waydro.id/system
vendor_channel=https://ota.waydro.id/vendor
image_type=VANILLA
