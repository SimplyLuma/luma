<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="net.catcrafts.IMS1"/>
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <policy user="luma">
    <allow send_destination="net.catcrafts.IMS1"/>
    <allow receive_sender="net.catcrafts.IMS1"/>
  </policy>
  <!-- The pre-session greeter receives no ordinary IMS ABI.  The daemon also
       validates both emergency numbers and call ownership server-side. -->
  <policy user="greetd">
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="DialEmergency"/>
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="HangUpEmergency"/>
    <allow send_destination="net.catcrafts.IMS1"
           send_interface="net.catcrafts.IMS1"
           send_member="GetEmergencyCallState"/>
  </policy>
  <policy context="default">
    <deny send_destination="net.catcrafts.IMS1"/>
  </policy>
</busconfig>
