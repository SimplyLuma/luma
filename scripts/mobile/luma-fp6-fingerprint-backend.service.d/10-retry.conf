# The backend failed once at boot (17 Aug) after completing its RPMB and
# storage work, then exited 1 -- a transient fault, not a gate timeout: the
# graphical gate waits for phoc, phosh and the ScreenSaver interface, and the
# same unit starts cleanly once the session is up. Retry rather than leaving
# fingerprint unlock dead until someone notices.
[Service]
Restart=on-failure
RestartSec=20
