# A flat 30s restart let imsd hammer the P-CSCF after a fatal bring-up error:
# 7 rapid re-registrations against a core that was already answering SIP 480,
# which makes recovery harder rather than easier -- the network needs a quiet
# period, and the restart loop denies it one. Back off exponentially instead,
# 15s to 10min, and never give up entirely (StartLimitIntervalSec=0) so the
# daemon still recovers on its own once the network settles.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=15
RestartSteps=6
RestartMaxDelaySec=600
