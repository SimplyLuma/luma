# GDM's state and log directories exist before any unit starts. The base image
# carries no /var content and GDM creates them only when it first runs, so on a
# freshly installed machine luma-greeter-displays.service (ReadWritePaths=
# /var/lib/gdm, ordered before GDM) failed its first boot. Mode and owner match
# what GDM creates.
d /var/lib/gdm 0755 root root -
d /var/log/gdm 0711 root gdm -
