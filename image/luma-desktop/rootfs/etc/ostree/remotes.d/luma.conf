# Luma operating system updates (ADR-030 section 5). Signed commits and a
# signed summary are required; the only trusted key is the Luma OS Release key.
# The repository URL is in the root-only mirror list /etc/luma/update-mirrorlist
# (https://dl.simplyluma.com/os/repo as shipped). Preview enrollment (beta,
# nightly) rewrites only that list with the device's credential path, so this
# world-readable file never changes and never holds a credential
# (docs/os/luma-update.md). Nothing adds a second definition of the remote.
[remote "luma"]
url=mirrorlist=file:///etc/luma/update-mirrorlist
gpg-verify=true
gpg-verify-summary=true
gpgkeypath=/etc/pki/ostree/luma-release.gpg
collection-id=org.projectluma.OS
