[Unit]
# phosh can outrun the compositor: it would exhaust systemd's default three
# restarts inside one second, all with "cannot open display", before phoc had
# created the socket, and then be refused for starting too quickly. Give it a
# patient retry window instead of a burst.
StartLimitIntervalSec=90
StartLimitBurst=20

[Service]
# The handheld user session owns its compositor and imports that compositor's
# actual WAYLAND_DISPLAY into the fresh, non-lingering user manager. Never pin
# the old pre-authentication socket here: doing so can attach Phosh to a stale
# compositor and recreate the boot/login race this unit is meant to prevent.
Restart=on-failure
RestartSec=1
ExecStart=
ExecStart=/opt/luma/phosh/libexec/phosh --locked
