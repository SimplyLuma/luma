[Unit]
# Luma's authenticated handheld display manager uses tty7, leaving the boot
# console on tty1. Keep autovt/getty ownership off the dedicated display VT.
Conflicts=getty@tty7.service
After=getty@tty7.service

[Service]
# The Luma greetd downstream keeps authenticated graphical sessions in
# KD_GRAPHICS while Cage releases DRM and Phoc acquires it. Generic greeter and
# text-session behavior remains unchanged when this marker is absent.
Environment=LUMA_GREETD_GRAPHICAL_HANDOFF=1
