# SPDX-License-Identifier: Apache-2.0
# Mesa drivers for org.projectluma.Platform, built exactly as Fedora builds
# org.fedoraproject.Platform.GL.default, from Luma's Mesa RPMs (patches/mesa:
# Fedora 44's Mesa with H.264/H.265 hardware encode, MESA_NEVRA in
# config/desktop/inputs.env), which the luma repository supplies in place of
# Fedora's; moved into the extension prefix that the runtime's GL extension
# point mounts at lib64/GL/default. On x86_64 it also carries Luma's Intel
# VA-API driver (iHD), so VA decode and encode work inside Flatpaks on Intel
# GPUs, as radeonsi's does on AMD.
base: fedora-f44/gl-default.container.yaml
upstream:
  repository: https://src.fedoraproject.org/flatpaks/mesa
  branch: f44
  commit: bad0ea246e062c32e1cc3b7f63c74d3f85fa2aae

flatpak:
  id: org.projectluma.Platform.GL.default
  runtime-version: '44'
  branch: '44'
  name: luma/mesa
  component: luma-platform-gl-default

remove-packages:
  # Fedora's mesa-flatpak-config exists only in Koji's Flatpak tags and carries
  # the extension's component data; Luma writes its own below.
  - mesa-flatpak-config

add-packages:
  # Luma's build (packaging/rpm/intel-media-driver-free.spec, VDEnc H.264/H.265
  # encode on) shadows Fedora's from the luma repository. Fedora's cleanup moves
  # it with Mesa's drivers to lib/dri, which the GL extension point merges into
  # lib64/GL/lib/dri on the runtime's LIBVA_DRIVERS_PATH.
  - name: libva-intel-media-driver
    platforms:
      only:
      - x86_64

cleanup-append: |
  # The iHD driver's one library the runtime lacks
  if [ -e /app/lib/dri/iHD_drv_video.so ]; then
    mv /usr/lib64/libigdgmm.so* /app/lib/
  fi
  mkdir -p /app/share/metainfo
  cat > /app/share/metainfo/org.projectluma.Platform.GL.default.metainfo.xml <<'XML'
  <?xml version="1.0" encoding="UTF-8"?>
  <component type="runtime">
    <id>org.projectluma.Platform.GL.default</id>
    <metadata_license>CC0-1.0</metadata_license>
    <name>Mesa</name>
    <summary>Mesa OpenGL and Vulkan drivers for the Luma Platform</summary>
    <url type="homepage">https://mesa3d.org/</url>
  </component>
  XML
