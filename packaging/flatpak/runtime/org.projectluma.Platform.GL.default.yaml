# SPDX-License-Identifier: Apache-2.0
# Mesa drivers for org.projectluma.Platform, built exactly as Fedora builds
# org.fedoraproject.Platform.GL.default: Fedora 44's Mesa RPMs, moved into the
# extension prefix that the runtime's GL extension point mounts at lib64/GL/default.
base: fedora-f44/gl-default.container.yaml
upstream:
  repository: https://src.fedoraproject.org/flatpaks/mesa
  branch: f44
  commit: bad0ea246e062c32e1cc3b7f63c74d3f85fa2aae

flatpak:
  id: org.projectluma.Platform.GL.default
  runtime-version: '44'
  branch: '44'
  name: luma/mesa
  component: luma-platform-gl-default

remove-packages:
  # Fedora's mesa-flatpak-config exists only in Koji's Flatpak tags and carries
  # the extension's component data; Luma writes its own below.
  - mesa-flatpak-config

cleanup-append: |
  mkdir -p /app/share/metainfo
  cat > /app/share/metainfo/org.projectluma.Platform.GL.default.metainfo.xml <<'XML'
  <?xml version="1.0" encoding="UTF-8"?>
  <component type="runtime">
    <id>org.projectluma.Platform.GL.default</id>
    <metadata_license>CC0-1.0</metadata_license>
    <name>Mesa</name>
    <summary>Mesa OpenGL and Vulkan drivers for the Luma Platform</summary>
    <url type="homepage">https://mesa3d.org/</url>
  </component>
  XML
