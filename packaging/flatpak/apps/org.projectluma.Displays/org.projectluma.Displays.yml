# SPDX-License-Identifier: Apache-2.0
{
  "id": "org.projectluma.Displays",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "org.projectluma.Displays",
  "finish-args": [
    "--metadata=X-Luma=app-data-schema=displays-v1",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--talk-name=org.gnome.Mutter.DisplayConfig",
    "--talk-name=org.projectluma.AppData1",
    "--metadata=X-Luma=min-host-installer=57",
    "--filesystem=xdg-config/monitors.xml:ro",
    "--talk-name=org.gnome.Settings"
  ],
  "modules": [
    {
      "name": "displays",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/luma-displays/luma_displays /app/lib/python3.14/site-packages/",
        "printf '#!/bin/sh\\nexec python3 -m luma_displays \"$@\"\\n' > /app/bin/org.projectluma.Displays-real",
        "chmod 755 /app/bin/org.projectluma.Displays-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup org.projectluma.Displays-real \"$@\"\\n' > /app/bin/org.projectluma.Displays",
        "chmod 755 /app/bin/org.projectluma.Displays",
        "install -Dm644 src/luma-displays/data/org.projectluma.Displays.desktop /app/share/applications/org.projectluma.Displays.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Displays.svg",
        "sed -i 's/^Icon=.*/Icon=org.projectluma.Displays/' /app/share/applications/org.projectluma.Displays.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Displays.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Displays/LICENSE.md",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectluma.Displays\\nExec=/app/bin/org.projectluma.Displays\\n' > /app/share/dbus-1/services/org.projectluma.Displays.service",
        "install -d /app/share/luma-app-media",
        "install -m644 depot-media/*.png /app/share/luma-app-media/"
      ]
    }
  ],
  "appstream-compose": false
}
