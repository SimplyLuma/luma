# SPDX-License-Identifier: Apache-2.0
{
  "appstream-compose": false,
  "id": "org.projectluma.Photos",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-photos",
  "finish-args": [
    "--env=LUMA_PHOTOS_STYLE_PATH=/app/share/prairie-core/photos.css",
    "--metadata=X-Luma=app-data-schema=photos-v1",
    "--metadata=X-Luma=min-host-installer=64",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--filesystem=xdg-data/luma-photos:create",
    "--filesystem=xdg-pictures:create",
    "--filesystem=xdg-config/user-dirs.dirs:ro",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "photos",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-photos /app/bin/prairie-photos-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-photos-real \"$@\"\\n' > /app/bin/prairie-photos",
        "chmod 755 /app/bin/prairie-photos",
        "install -Dm644 src/prairie-core/data/org.projectluma.Photos.desktop /app/share/applications/org.projectluma.Photos.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Photos.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Photos.metainfo.xml",
        "install -Dm644 depot-media/39f76e9a097324ccab7b6e1827f7991a3b104ed61fffc6212591bd96ddbbd3fd.png /app/share/luma-app-media/39f76e9a097324ccab7b6e1827f7991a3b104ed61fffc6212591bd96ddbbd3fd.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Photos/LICENSE.md"
      ]
    }
  ]
}
