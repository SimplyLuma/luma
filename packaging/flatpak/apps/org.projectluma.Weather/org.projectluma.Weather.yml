{
  "appstream-compose": false,
  "id": "org.projectluma.Weather",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-weather",
  "finish-args": [
    "--env=LUMA_WEATHER_STYLE_PATH=/app/share/prairie-core/weather.css",
    "--metadata=X-Luma=app-data-schema=weather-v1",
    "--metadata=X-Luma=min-host-installer=60",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--system-talk-name=org.freedesktop.GeoClue2",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "weather",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-weather /app/bin/prairie-weather-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-weather-real \"$@\"\\n' > /app/bin/prairie-weather",
        "chmod 755 /app/bin/prairie-weather",
        "install -Dm644 src/prairie-core/data/org.projectluma.Weather.desktop /app/share/applications/org.projectluma.Weather.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Weather.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Weather.metainfo.xml",
        "install -Dm644 depot-media/79350b762d9d2c4165e25d0b25710a06ddc6c0ef9855d51a081fa138c2ccbe15.png /app/share/luma-app-media/79350b762d9d2c4165e25d0b25710a06ddc6c0ef9855d51a081fa138c2ccbe15.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Weather/LICENSE.md"
      ]
    }
  ]
}
