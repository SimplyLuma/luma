# SPDX-License-Identifier: Apache-2.0
{
  "appstream-compose": false,
  "id": "org.projectluma.Leaf",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "org.projectluma.Leaf",
  "finish-args": [
    "--metadata=X-Luma=app-data-schema=leaf-v1",
    "--metadata=X-Luma=min-host-installer=60",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--socket=pulseaudio",
    "--filesystem=xdg-run/speech-dispatcher",
    "--env=LUMA_LEAF_DATA_DIR=/app/share/leaf",
    "--talk-name=org.projectluma.AppData1",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "leaf",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/luma-leaf/luma_leaf /app/lib/python3.14/site-packages/",
        "printf '#!/bin/sh\\nexec python3 -m luma_leaf \"$@\"\\n' > /app/bin/leaf-real",
        "chmod 755 /app/bin/leaf-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup leaf-real \"$@\"\\n' > /app/bin/org.projectluma.Leaf",
        "chmod 755 /app/bin/org.projectluma.Leaf",
        "install -Dm644 src/luma-leaf/data/org.projectluma.Leaf.desktop /app/share/applications/org.projectluma.Leaf.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Leaf.svg",
        "sed -i 's/^Icon=.*/Icon=org.projectluma.Leaf/' /app/share/applications/org.projectluma.Leaf.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Leaf.metainfo.xml",
        "install -Dm644 depot-media/35a8f0614c92dc10c67f062fdd854f8d43f6d3754e42cbc8064f636f398fe40f.png /app/share/luma-app-media/35a8f0614c92dc10c67f062fdd854f8d43f6d3754e42cbc8064f636f398fe40f.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Leaf/LICENSE.md",
        "install -d /app/share/leaf",
        "cp -a src/luma-leaf/data/. /app/share/leaf/",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectluma.Leaf\\nExec=/app/bin/org.projectluma.Leaf\\n' > /app/share/dbus-1/services/org.projectluma.Leaf.service"
      ]
    }
  ]
}
