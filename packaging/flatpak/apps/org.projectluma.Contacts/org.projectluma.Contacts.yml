{
  "id": "org.projectluma.Contacts",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-contacts",
  "finish-args": [
    "--env=LUMA_CONTACTS_STYLE_PATH=/app/share/prairie-core/contacts.css",
    "--metadata=X-Luma=min-host-core=97",
    "--metadata=X-Luma=app-data-schema=contacts-v1",
    "--metadata=X-Luma=min-host-installer=64",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--talk-name=org.gnome.evolution.dataserver.Sources5",
    "--talk-name=org.gnome.evolution.dataserver.AddressBook10",
    "--talk-name=org.projectluma.Connect1",
    "--metadata=X-Luma=min-host-continuity=63",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "contacts",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-contacts /app/bin/prairie-contacts-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-contacts-real \"$@\"\\n' > /app/bin/prairie-contacts",
        "chmod 755 /app/bin/prairie-contacts",
        "install -Dm644 src/prairie-core/data/org.projectluma.Contacts.desktop /app/share/applications/org.projectluma.Contacts.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Contacts.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Contacts.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Contacts/LICENSE.md",
        "install -Dm644 depot-media/8f4abf18eb9bf0c815aafd9416dd29fd9b5d2d46f94da8d0fa54a8bcc2638ede.png /app/share/luma-app-media/8f4abf18eb9bf0c815aafd9416dd29fd9b5d2d46f94da8d0fa54a8bcc2638ede.png"
      ]
    }
  ],
  "appstream-compose": false
}
