{
  "id": "org.projectluma.Tasks",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-tasks",
  "finish-args": [
    "--env=LUMA_TASKS_STYLE_PATH=/app/share/prairie-core/tasks.css",
    "--metadata=X-Luma=app-data-schema=tasks-v1",
    "--metadata=X-Luma=min-host-installer=64",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--talk-name=org.gnome.evolution.dataserver.Sources5",
    "--talk-name=org.gnome.evolution.dataserver.Calendar8",
    "--talk-name=org.projectluma.Connect1",
    "--metadata=X-Luma=min-host-continuity=63",
    "--metadata=X-Luma=min-host-core=97",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "tasks",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-tasks /app/bin/prairie-tasks-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-tasks-real \"$@\"\\n' > /app/bin/prairie-tasks",
        "chmod 755 /app/bin/prairie-tasks",
        "install -Dm644 src/prairie-core/data/org.projectluma.Tasks.desktop /app/share/applications/org.projectluma.Tasks.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Tasks.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Tasks.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Tasks/LICENSE.md",
        "install -Dm644 depot-media/8c6d5588fd6c3034403c39111d923cd520433b7223f732265cc94d043a6e699a.png /app/share/luma-app-media/8c6d5588fd6c3034403c39111d923cd520433b7223f732265cc94d043a6e699a.png"
      ]
    }
  ],
  "appstream-compose": false
}
