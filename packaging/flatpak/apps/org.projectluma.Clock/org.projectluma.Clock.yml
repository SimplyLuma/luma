# SPDX-License-Identifier: Apache-2.0
{
  "appstream-compose": false,
  "id": "org.projectluma.Clock",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-clock",
  "finish-args": [
    "--env=LUMA_CLOCK_STYLE_PATH=/app/share/prairie-core/clock.css",
    "--metadata=X-Luma=app-data-schema=clock-v1",
    "--metadata=X-Luma=min-host-installer=60",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--talk-name=org.projectluma.Background1",
    "--system-talk-name=org.freedesktop.timedate1",
    "--talk-name=org.projectluma.ClockHost1",
    "--metadata=X-Luma=min-host-core=93",
    "--metadata=X-Luma=min-host-background=5",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "clock",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-clock /app/bin/prairie-clock-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-clock-real \"$@\"\\n' > /app/bin/prairie-clock",
        "chmod 755 /app/bin/prairie-clock",
        "install -Dm644 src/prairie-core/data/org.projectluma.Clock.desktop /app/share/applications/org.projectluma.Clock.desktop",
        "install -d /app/share/dbus-1/services",
        "sed 's|@bindir@|/app/bin|g' src/prairie-core/data/org.projectluma.Clock.service.in > /app/share/dbus-1/services/org.projectluma.Clock.service",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Clock.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Clock.metainfo.xml",
        "install -Dm644 depot-media/70b1cdb41fcf7de849c9e52375081477e135cc1b4aa17449b2f87c7b1e1bab49.png /app/share/luma-app-media/70b1cdb41fcf7de849c9e52375081477e135cc1b4aa17449b2f87c7b1e1bab49.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Clock/LICENSE.md"
      ]
    }
  ]
}
