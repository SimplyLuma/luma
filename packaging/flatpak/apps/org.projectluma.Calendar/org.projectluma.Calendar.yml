{
  "appstream-compose": false,
  "id": "org.projectluma.Calendar",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "prairie-calendar",
  "finish-args": [
    "--env=LUMA_CALENDAR_STYLE_PATH=/app/share/prairie-core/calendar.css",
    "--metadata=X-Luma=app-data-schema=calendar-v1",
    "--metadata=X-Luma=min-host-installer=60",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--share=network",
    "--talk-name=org.projectluma.AppData1",
    "--talk-name=org.gnome.evolution.dataserver.Sources5",
    "--talk-name=org.gnome.evolution.dataserver.Calendar8",
    "--talk-name=org.projectluma.Connect1",
    "--env=XDG_STATE_HOME=/var/data/state",
    "--talk-name=org.projectluma.ApplicationDirectory1"
  ],
  "modules": [
    {
      "name": "calendar",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin /app/share/prairie-core",
        "cp -a src/prairie-core/prairie_apps /app/lib/python3.14/site-packages/",
        "install -Dm755 src/prairie-core/bin/prairie-calendar /app/bin/prairie-calendar-real",
        "printf '#!/bin/sh\\nexec python3 -m luma_appkit.migration_startup prairie-calendar-real \"$@\"\\n' > /app/bin/prairie-calendar",
        "chmod 755 /app/bin/prairie-calendar",
        "install -Dm644 src/prairie-core/data/org.projectluma.Calendar.desktop /app/share/applications/org.projectluma.Calendar.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Calendar.svg",
        "cp -a src/prairie-core/style/. /app/share/prairie-core/",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Calendar.metainfo.xml",
        "install -Dm644 depot-media/8e3cb385111d2a692cb2c8c77d1ad234d83f141e78ece65115aa9ffddcb0850f.png /app/share/luma-app-media/8e3cb385111d2a692cb2c8c77d1ad234d83f141e78ece65115aa9ffddcb0850f.png",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Calendar/LICENSE.md"
      ]
    }
  ]
}
