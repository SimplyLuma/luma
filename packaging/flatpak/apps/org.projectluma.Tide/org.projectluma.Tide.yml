# Sources are attached by seal-first-party-source.py with exact archive SHA256.
# This template cannot build until a source archive has been sealed.
id: org.projectluma.Tide
runtime: org.projectluma.Platform
runtime-version: '44'
sdk: org.projectluma.Sdk
command: org.projectluma.Tide
appstream-compose: false
finish-args:
  - --talk-name=org.projectluma.ApplicationDirectory1
  - --metadata=X-Luma=min-host-installer=60
  - --metadata=X-Luma=app-data-schema=tide-v1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.projectluma.AppData1
  - --own-name=org.mpris.MediaPlayer2.Tide
modules:
  - name: tide
    buildsystem: meson
    subdir: src/luma-tide
    config-opts:
      - --buildtype=release
    post-install:
      - mv /app/bin/org.projectluma.Tide /app/bin/luma-tide-real
      - printf '#!/bin/sh\nexec python3 -m luma_appkit.migration_startup luma-tide-real "$@"\n' > /app/bin/org.projectluma.Tide
      - chmod 755 /app/bin/org.projectluma.Tide
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/depot.metainfo.xml" /app/share/metainfo/org.projectluma.Tide.metainfo.xml
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/depot-media/54e8384883b98ef609ad5a5361c7981928becd95ced88bc5080946a6c8d85611.png" /app/share/luma-app-media/54e8384883b98ef609ad5a5361c7981928becd95ced88bc5080946a6c8d85611.png
      - install -Dm644 "$FLATPAK_BUILDER_BUILDDIR/LICENSE.md" /app/share/licenses/org.projectluma.Tide/LICENSE.md
