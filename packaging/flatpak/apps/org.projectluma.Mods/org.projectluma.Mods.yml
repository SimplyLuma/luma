# SPDX-License-Identifier: Apache-2.0
appstream-compose: false
id: org.projectluma.Mods
runtime: org.projectluma.Platform
runtime-version: '44'
sdk: org.projectluma.Sdk
command: luma-mods
finish-args:
  - --metadata=X-Luma=min-host-mods=24
  - --metadata=X-Luma=min-host-installer=57
  - --metadata=X-Luma=app-data-schema=mods-host-v1
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.projectluma.ModProfiles1
  - --system-talk-name=org.projectluma.ModTransactions1
modules:
  - name: mods-ui
    buildsystem: simple
    build-commands:
      - install -d /app/lib/python3.14/site-packages /app/bin
      - cp -a src/luma-mods/luma_mods /app/lib/python3.14/site-packages/
      - printf '#!/bin/sh\nexec python3 -m luma_mods.gallery "$@"\n' > /app/bin/luma-mods
      - chmod 755 /app/bin/luma-mods
      - install -Dm644 src/luma-mods/data/org.projectluma.Mods.desktop /app/share/applications/org.projectluma.Mods.desktop
      - sed -i 's/^Icon=.*/Icon=org.projectluma.Mods/' /app/share/applications/org.projectluma.Mods.desktop
      - install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Mods.svg
      - install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Mods.metainfo.xml
      - install -Dm644 depot-media/8471041c907fc2e92802073f2346df34fb324f2ebcb121fb9a06aeb4f60fa44a.png /app/share/luma-app-media/8471041c907fc2e92802073f2346df34fb324f2ebcb121fb9a06aeb4f60fa44a.png
      - install -Dm644 depot-media/ad04d1bc6129e121170e72247768d275f6db34ac595ad6d4fc2bc1b29465bb6c.png /app/share/luma-app-media/ad04d1bc6129e121170e72247768d275f6db34ac595ad6d4fc2bc1b29465bb6c.png
      - install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Mods/LICENSE.md
