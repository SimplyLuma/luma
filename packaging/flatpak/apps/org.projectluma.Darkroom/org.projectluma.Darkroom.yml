# Sealed sources required by the canonical first-party producer.
{
  "id": "org.projectluma.Darkroom",
  "runtime": "org.projectluma.Platform",
  "runtime-version": "44",
  "sdk": "org.projectluma.Sdk",
  "command": "luma-darkroom",
  "finish-args": [
    "--metadata=X-Luma=app-data-schema=darkroom-v1",
    "--share=ipc",
    "--socket=wayland",
    "--socket=fallback-x11",
    "--device=dri",
    "--env=LUMA_DARKROOM_STYLE_PATH=/app/share/luma-darkroom/darkroom.css"
  ],
  "modules": [
    {
      "name": "darkroom",
      "buildsystem": "simple",
      "build-commands": [
        "install -d /app/lib/python3.14/site-packages /app/bin",
        "cp -a src/luma-darkroom/luma_darkroom /app/lib/python3.14/site-packages/",
        "install -Dm755 src/luma-darkroom/bin/luma-darkroom /app/bin/luma-darkroom",
        "install -Dm644 src/luma-darkroom/data/org.projectluma.Darkroom.desktop /app/share/applications/org.projectluma.Darkroom.desktop",
        "install -Dm644 depot-icon.svg /app/share/icons/hicolor/scalable/apps/org.projectluma.Darkroom.svg",
        "sed -i 's/^Icon=.*/Icon=org.projectluma.Darkroom/' /app/share/applications/org.projectluma.Darkroom.desktop",
        "install -Dm644 depot.metainfo.xml /app/share/metainfo/org.projectluma.Darkroom.metainfo.xml",
        "install -Dm644 LICENSE.md /app/share/licenses/org.projectluma.Darkroom/LICENSE.md",
        "install -Dm644 src/luma-darkroom/style/darkroom.css /app/share/luma-darkroom/darkroom.css",
        "install -d /app/lib/python3.14/site-packages/data/icons",
        "cp -a src/luma-darkroom/data/icons/. /app/lib/python3.14/site-packages/data/icons/",
        "install -d /app/share/dbus-1/services",
        "printf '[D-BUS Service]\\nName=org.projectluma.Darkroom\\nExec=/app/bin/luma-darkroom\\n' > /app/share/dbus-1/services/org.projectluma.Darkroom.service"
      ]
    }
  ]
}
