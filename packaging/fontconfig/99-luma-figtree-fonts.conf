<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: MIT -->
<fontconfig>
  <description>Prefer Figtree for the Luma system interface</description>
  <!-- This preference intentionally loads after Fedora's language fallback
       rules. Figtree is the first Latin UI/sans choice on every account;
       fontconfig continues down Fedora's fallback chain for glyphs that the
       family does not cover. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Figtree</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Figtree</string>
    </edit>
  </match>
</fontconfig>
