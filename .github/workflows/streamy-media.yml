name: Streamy media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamy-media.yml'
      - 'src/luma-streamy/**'
      - 'packaging/rpm/luma-streamy.spec'
      - 'scripts/packages/build-luma-streamy.sh'
      - 'scripts/packages/build-luma-streamy-source.sh'
  pull_request:
    paths:
      - '.github/workflows/streamy-media.yml'
      - 'src/luma-streamy/**'
      - 'packaging/rpm/luma-streamy.spec'
      - 'scripts/packages/build-luma-streamy.sh'
      - 'scripts/packages/build-luma-streamy-source.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lumaframe:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    env:
      # Headless GL: Mesa's EGL surfaceless platform on llvmpipe.
      GST_GL_PLATFORM: egl
      GST_GL_WINDOW: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: src/luma-streamy/gst-lumaframe
    steps:
      - name: Install Rust, GStreamer and Mesa
        working-directory: /
        run: >-
          dnf -y --setopt=install_weak_deps=False install git-core rust cargo rustfmt clippy gcc
          pkgconf-pkg-config gstreamer1-devel gstreamer1-plugins-base-devel
          gstreamer1-plugins-base-tools mesa-dri-drivers mesa-libEGL
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch the locked crates
        run: cargo fetch --locked
      - name: Format and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Geometry and shadow maths
        run: cargo test --locked --offline --lib
      - name: GL pipelines on llvmpipe
        run: cargo test --locked --offline --test pipeline -- --test-threads=2
      - name: Release plugin loads in GStreamer
        run: |
          cargo build --release --locked --offline
          GST_PLUGIN_PATH="$PWD/target/release" gst-inspect-1.0 lumaframe
          gst-inspect-1.0 --version

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scene model, layouts and the pipeline graph
        run: PYTHONPATH=src/luma-streamy python3 -B -m unittest discover -s src/luma-streamy/tests -p 'test_*.py' -v

  engine:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    env:
      GST_GL_PLATFORM: egl
      GST_GL_WINDOW: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      CARGO_TERM_COLOR: never
    steps:
      - name: Install Rust, GStreamer, the encoders and Mesa
        run: >-
          dnf -y --setopt=install_weak_deps=False --enablerepo=fedora-cisco-openh264 install git-core rust cargo gcc
          pkgconf-pkg-config gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-base-tools
          gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugin-openh264 openh264
          mesa-dri-drivers mesa-libEGL python3-gobject python3-cairo ffmpeg-free
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build lumaframe
        working-directory: src/luma-streamy/gst-lumaframe
        run: cargo build --release --locked
      - name: A failing or silent source comes out of the program without stalling it
        run: GST_PLUGIN_PATH="$PWD/src/luma-streamy/gst-lumaframe/target/release" python3 src/luma-streamy/tests/engine_failure.py
      - name: Every widget is drawn on both canvases after a start and a restart
        run: GST_PLUGIN_PATH="$PWD/src/luma-streamy/gst-lumaframe/target/release" STREAMY_DRAWN_S=5 python3 src/luma-streamy/tests/engine_relaunch.py
      - name: Record 10 s headless and check the file
        run: |
          export GST_PLUGIN_PATH="$PWD/src/luma-streamy/gst-lumaframe/target/release"
          mkdir -p /tmp/smoke
          python3 src/luma-streamy/tests/engine_smoke.py /tmp/smoke -
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,sample_rate -of compact /tmp/smoke/smoke.mkv | tee /tmp/smoke/probe.txt
          grep -q 'codec_name=h264|width=1920|height=1080' /tmp/smoke/probe.txt
          grep -q 'codec_name=aac|sample_rate=48000' /tmp/smoke/probe.txt

  # The package the desktop pins (config/desktop/packages.txt): the app and the
  # plugin, checked in %check against the admitted LumaUI toolkit.
  rpm:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:69b1219730fe52d6cbb0874cbc1a36dd43b722354a603f6cdf73acbff8dd7c59
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: registry.fedoraproject.org/fedora@sha256:22dbf85bb441d15ebec58522f98636699b4dc722d89f19a3f01c8ed382695b57
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    permissions:
      contents: read
      actions: read
    env:
      LUMA_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
      LUMA_RPM_BUILDER_DIRECT: '1'
      LUMA_RPM_BUILDER_ARCHITECTURE: ${{ matrix.architecture }}
      RPM_BUILD_NCPUS: '4'
    steps:
      - name: Prepare native Fedora tools
        run: dnf5 -y install git gh cpio curl rpm-build rpmdevtools dnf5-plugins python3 findutils glibc-langpack-en
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the checked LumaUI toolkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/os/admit-desktop-toolkit.py --architecture "$LUMA_TARGET_ARCHITECTURE"
      - name: Build and check luma-streamy
        run: |
          test "$(rpm --eval '%{_arch}')" = "$LUMA_TARGET_ARCHITECTURE"
          git -c safe.directory="$PWD" rev-parse HEAD > build/SOURCE-REVISION
          export SOURCE_DATE_EPOCH=$(git -c safe.directory="$PWD" log -1 --format=%ct HEAD)
          bash scripts/packages/build-luma-streamy.sh
      - name: Retain checked RPMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-streamy-${{ matrix.architecture }}
          path: |
            build/packages/luma-streamy/RPMS/
            build/packages/luma-streamy/SRPMS/
            build/packages/luma-streamy/SHA256SUMS
            build/SOURCE-REVISION
          if-no-files-found: error
          retention-days: 14
