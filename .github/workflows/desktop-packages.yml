name: Desktop packages

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'scripts/packages/run-in-rpm-builder.sh'
      - 'scripts/packages/build-gtk3.sh'
      - 'patches/gtk3/**'
      - 'scripts/packages/build-luma-search.sh'
      - 'src/luma-search/**'
      - 'packaging/rpm/luma-search.spec'
      - 'config/desktop/inputs.env'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packages:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:69b1219730fe52d6cbb0874cbc1a36dd43b722354a603f6cdf73acbff8dd7c59
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: registry.fedoraproject.org/fedora@sha256:22dbf85bb441d15ebec58522f98636699b4dc722d89f19a3f01c8ed382695b57
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      LUMA_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
      LUMA_RPM_BUILDER_DIRECT: '1'
      # Bound inner RPM parallelism independently of the runner size.
      RPM_BUILD_NCPUS: '2'
    steps:
      - name: Prepare native Fedora build tools
        run: dnf5 -y install git podman cpio curl patch rpm-build rpmdevtools dnf5-plugins python3 findutils glibc-langpack-en
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check native architecture
        run: test "$(rpm --eval '%{_arch}')" = "$LUMA_TARGET_ARCHITECTURE"
      - name: Build and check the shared Search package
        run: bash scripts/packages/build-luma-search.sh
      - name: Build and check the shared GTK3 package
        run: bash scripts/packages/build-gtk3.sh
      - name: Retain checked packages and source RPMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-packages-${{ matrix.architecture }}
          path: |
            build/packages/luma-search/RPMS/
            build/packages/luma-search/SRPMS/
            build/packages/luma-search/SHA256SUMS
            build/packages/gtk3/RPMS/
            build/packages/gtk3/SRPMS/
            build/packages/gtk3/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
