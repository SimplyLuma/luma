name: Native Depot tooling

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-depot.yml'
      - 'scripts/depot/install-tools-packages.sh'
      - 'scripts/depot/probe-native-tools.sh'
      - 'scripts/depot/tools-container.sh'
  workflow_dispatch:
    inputs:
      operation:
        description: Native keyless task
        required: true
        default: tooling
        type: choice
        options: [tooling, filer]
      architecture:
        description: Native builder CPU
        required: true
        default: aarch64
        type: choice
        options: [aarch64, x86_64]

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'pull_request' || inputs.operation != 'filer'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:69b1219730fe52d6cbb0874cbc1a36dd43b722354a603f6cdf73acbff8dd7c59
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: registry.fedoraproject.org/fedora@sha256:22dbf85bb441d15ebec58522f98636699b4dc722d89f19a3f01c8ed382695b57
    runs-on: ${{ matrix.runner }}
    env:
      DEPOT_ARCH: ${{ matrix.architecture }}
      BUILDER_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'pull_request' || inputs.architecture == matrix.architecture
        with:
          persist-credentials: false
      - name: Probe the normal native keyless Fedora tools
        if: github.event_name == 'pull_request' || inputs.architecture == matrix.architecture
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Only unused preinstalled tools on this disposable worker are removed.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          test "$available" -ge 34359738368
          # Ubuntu requires a named profile to grant unprivileged user namespaces.
          # Keep the host-wide restriction; allow only this keyless container.
          # https://documentation.ubuntu.com/security/security-features/privilege-restriction/apparmor/
          profile="$RUNNER_TEMP/luma-native-depot.apparmor"
          cat > "$profile" <<'APPARMOR'
          abi <abi/4.0>,
          profile luma-native-depot flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace "$profile"
          trap 'sudo apparmor_parser --remove "$profile"' EXIT
          docker run --rm --cpus=4 --memory=12g --pids-limit=2048 \
            --cap-add SYS_ADMIN --cap-add NET_ADMIN --device /dev/fuse \
            --security-opt apparmor=luma-native-depot --security-opt seccomp=unconfined \
            --security-opt systempaths=unconfined \
            --env DEPOT_ARCH --env BUILDER_IMAGE \
            --env "DEPOT_ROOT=$GITHUB_WORKSPACE/build/native-depot-probe/$DEPOT_ARCH" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" bash scripts/depot/probe-native-tools.sh
      - name: Retain namespace denial diagnostics
        if: failure() && (github.event_name == 'pull_request' || inputs.architecture == matrix.architecture)
        run: sudo dmesg | grep -Ei 'apparmor.*(denied|userns)|bwrap' | tail -n 30 || true
      - name: Retain actual native tooling evidence
        if: github.event_name == 'pull_request' || inputs.architecture == matrix.architecture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-depot-tools-${{ matrix.architecture }}
          path: |
            build/native-depot-probe/${{ matrix.architecture }}/NATIVE-TOOLS-RECEIPT.json
            build/native-depot-probe/${{ matrix.architecture }}/logs/
          if-no-files-found: error
          retention-days: 14

  filer:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'filer' && inputs.architecture == 'aarch64'
    uses: ./.github/workflows/native-arm-filer.yml
