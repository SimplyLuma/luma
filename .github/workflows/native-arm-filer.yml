name: Native ARM Filer provider

on:
  workflow_call:

permissions:
  contents: read

jobs:
  filer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the exact component source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bdaf62fd08989b790decfac941a6947f8f72273a
          path: product-source
          persist-credentials: false
      - name: Build the unchanged Filer recipe with the signed portable SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-arm-filer-logs
          timeout --signal=TERM --kill-after=30s 1500s \
            bash scripts/depot/run-native-arm-filer-ci.sh \
            2>&1 | tee build/native-arm-filer-logs/host-runner.log
      - name: Retain namespace denial diagnostics
        if: failure()
        run: sudo dmesg | grep -Ei 'apparmor.*(denied|userns)|bwrap' | tail -n 30 || true
      - name: Retain the unsigned provider and actual diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-filer-aarch64
          path: |
            build/native-arm-filer-ci/
            build/native-arm-filer-logs/
          if-no-files-found: error
          retention-days: 14
