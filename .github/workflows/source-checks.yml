name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Android graphics recovery and restart budget regressions
        run: |
          PYTHONPATH=src/luma-android python3 -B -m unittest discover -s src/luma-android/tests -p 'test_graphics_watchdog.py'
          PYTHONPATH=src/luma-android python3 -B -m unittest discover -s src/luma-android/tests -p 'test_recovery_launch.py'
          PYTHONPATH=src/luma-android python3 -B -m unittest discover -s src/luma-android/tests -p 'test_activation_budget.py'
          PYTHONPATH=src/luma-android python3 -B -m unittest discover -s src/luma-android/tests -p 'test_container_policy.py'
          python3 -B tests/android/cgroup-v2-task-profiles.py
  shell-presentation-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gjs
      - name: Handheld Home density, status ink and display exclusions
        run: |
          gjs -m tests/gnome-shell/presentation/compact-layout.js
          gjs -m tests/gnome-shell/presentation/density.js
          gjs -m tests/gnome-shell/presentation/home-catalog.js
      - name: Status glyphs and the cellular indicator's states
        run: |
          gjs -m tests/gnome-shell/presentation/status-glyphs.js
          gjs -m tests/gnome-shell/presentation/cellular-status.js
  public-source-contracts:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # HEAD^1 is the base of the change (a pull request's merge commit, or
          # the previous main commit).
          fetch-depth: 2
      - name: Install the schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/source-checks"
          "$RUNNER_TEMP/source-checks/bin/pip" install --quiet jsonschema==4.23.0
      - name: Check the public repository and source contracts
        run: 'PATH="$RUNNER_TEMP/source-checks/bin:$PATH" bash tools/check-repository.sh'
      # The image build runs this first; a pin with no matching spec or a
      # fragment naming an unpinned package stops the nightly.
      - name: Check the package release contract
        run: bash tests/smoke/package-release-contract.sh
      # The nightly's notes step fails when a system app (config/desktop/
      # system-apps.txt) changed without an "Updated <App> to X.Y" improvement
      # fragment; hold the change here instead.
      - name: Check system-app update notes
        run: python3 -B scripts/os/lib/system_apps_current.py pr --repo . --base HEAD^1 --head HEAD
      # Images ship the offline app baseline pinned in config/os/app-baseline-lock.json;
      # an app whose source changed needs a rebuilt bundle in a resealed baseline.
      - name: Check first-party apps against their baseline bundles
        run: |
          python3 -B scripts/depot/app-baseline-lock.py check
          python3 -B -m unittest discover -s tests/depot -p test_app_baseline_lock.py
  shared-search:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native Gio bindings
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0
      - name: Require the real desktop application binding
        run: /usr/bin/python3 -B -c 'from gi.repository import Gio; assert Gio.DesktopAppInfo'
      - name: Search contracts and missing-application regressions
        run: |
          /usr/bin/python3 -B -m unittest tests.unit.test_luma_search
          /usr/bin/python3 -B -m unittest discover -s tests/search -p 'test_*.py'
  ari:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Ari protocol test dependencies
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0 python3-jwt python3-cryptography
      - name: Ari subscription authentication, tool policy and daemon contracts
        run: PYTHONPATH=src/luma-ari /usr/bin/python3 -B -m unittest discover -s tests/luma-ari -p 'test_*.py'
  gradle-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Gradle wrapper JARs against published checksums
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  tester:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Tester contract dependencies
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-gtk-vnc-2.0 xorriso qemu-utils qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 openssh-client rsync
      - name: Tester workspace, download and VM contracts
        run: PYTHONPATH=src/luma-tester /usr/bin/python3 -B -m unittest discover -s src/luma-tester/tests -p 'test_*.py'

  depot-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Depot review checks, permission words and media rules
        run: /usr/bin/python3 -B -m unittest discover -s tools/depot-review/tests -p 'test_*.py'
