name: Native desktop toolkit

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-toolkit.yml'
      - 'scripts/os/build-desktop-toolkit.sh'
      - 'scripts/packages/build-gtk4.sh'
      - 'scripts/packages/build-libadwaita.sh'
      - 'scripts/packages/build-luma-developer-platform.sh'
      - 'scripts/packages/build-figtree-fonts.sh'
      - 'scripts/packages/run-in-rpm-builder.sh'
      - 'patches/gtk4/**'
      - 'patches/libadwaita/**'
      - 'src/luma-platform/**'
      - 'packaging/rpm/luma-developer-platform.spec'
      - 'config/desktop/inputs.env'
  workflow_dispatch:
    inputs:
      incremental:
        description: Reuse authenticated unchanged GTK, Adwaita and fonts; build the changed platform
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:69b1219730fe52d6cbb0874cbc1a36dd43b722354a603f6cdf73acbff8dd7c59
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: registry.fedoraproject.org/fedora@sha256:22dbf85bb441d15ebec58522f98636699b4dc722d89f19a3f01c8ed382695b57
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      LUMA_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
      LUMA_RPM_BUILDER_DIRECT: '1'
    steps:
      - name: Prepare native Fedora tools
        run: dnf5 -y install git gh podman cpio curl patch rpm-build rpmdevtools dnf5-plugins python3 findutils glibc-langpack-en
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build and check the toolkit cohort
        env:
          GH_TOKEN: ${{ github.token }}
          INCREMENTAL: ${{ inputs.incremental }}
        run: |
          if [ "$INCREMENTAL" = true ]; then
            python3 scripts/os/admit-desktop-toolkit.py --architecture "$LUMA_TARGET_ARCHITECTURE" --providers-only
            dnf5 -y install build/packages/gtk4/RPMS/"$LUMA_TARGET_ARCHITECTURE"/gtk4-*.rpm build/packages/figtree-fonts/RPMS/noarch/*.rpm
            bash scripts/packages/build-luma-developer-platform.sh
            git -c safe.directory="$PWD" rev-parse HEAD > build/SOURCE-REVISION
          else
            bash scripts/os/build-desktop-toolkit.sh
          fi
      - name: Retain checked toolkit packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-toolkit-${{ matrix.architecture }}
          path: |
            build/packages/**/RPMS/
            build/packages/**/SRPMS/
            build/packages/**/SHA256SUMS
            build/SOURCE-REVISION
          if-no-files-found: error
          retention-days: 14
