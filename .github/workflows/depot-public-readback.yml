name: Verify published signed application union
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install ordinary keyless verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ostree minisign
      - name: Verify exact public union and complete selected payloads
        run: |
          umask 077
          python3 -B scripts/depot/public-readback.py --profile config/depot/native38-public-readback-profile.json --profile-sha256 4f6a2ae5a8cd82bd0a3c98c2b3a063580372bbfd94733c8f83a9ab97c5945e98 --out "$RUNNER_TEMP/public-readback" --cache "$RUNNER_TEMP/public-cache"
      - name: Retain actual verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: depot-public-readback
          path: ${{ runner.temp }}/public-readback/
          if-no-files-found: error
          retention-days: 14
