name: Native desktop components

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-components.yml'
      - 'config/os/desktop-build-groups.json'
      - 'config/desktop/inputs.env'
      - 'scripts/os/desktop-package-matrix.py'
      - 'scripts/os/check-native-noarch-package.py'
      - 'scripts/packages/**'
      - 'patches/**'
      - 'src/luma-installer/**'
      - 'src/luma-depot/**'
      - 'src/luma-ari/**'
      - 'src/luma-desktop-launcher-policy/**'
      - 'src/luma-shell-state/org.project_luma.shell-state.gschema.xml'
      - 'src/luma-shell-state/**'
      - 'assets/icon-theme/**'
      - 'packaging/gsettings/90-prairie.gschema.override'
      - 'packaging/rpm/luma-shell-state.spec'
      - 'packaging/rpm/prairie-icon-theme.spec'
      - 'packaging/rpm/luma-application-installer.spec'
      - 'packaging/rpm/luma-ari.spec'
      - 'packaging/rpm/luma-desktop-launcher-policy.spec'
      - 'tests/luma-ari/**'
      - 'tests/fixtures/ari-v70*'
      - 'tests/fixtures/ari-v70-data/**'
      - 'tests/fixtures/depot-v70.json'
      - 'tests/fixtures/valet-v70*'
      - 'tests/fixtures/valet-v70/**'
      - 'tools/lumaui-conform/scenarios/ari.json'
      - 'config/desktop/system-flatpak-replacements.txt'
  workflow_dispatch:
    inputs:
      groups:
        description: Comma separated selected components (empty means all)
        type: string
        default: ""
      toolkit_run:
        description: Successful toolkit run for this exact source revision
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: matrix
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          SELECTED: ${{ inputs.groups }}
        run: |
          if [ -n "$BASE" ]; then
            matrix=$(python3 scripts/os/desktop-package-matrix.py --base "$BASE")
          else
            matrix=$(python3 scripts/os/desktop-package-matrix.py)
          fi
          if [ -n "$SELECTED" ]; then
            matrix=$(MATRIX="$matrix" python3 -c 'import json,os; m=json.loads(os.environ["MATRIX"]); a=os.environ["SELECTED"].split(","); assert a and len(a)==len(set(a)) and set(a)<=set(r["component"] for r in m["include"]); m["include"]=[r for r in m["include"] if r["component"] in a]; print(json.dumps(m))')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$matrix" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
  build:
    needs: select
    if: needs.select.outputs.count != '0'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      LUMA_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
      LUMA_RPM_BUILDER_DIRECT: '1'
      LUMA_RPM_BUILDER_ARCHITECTURE: ${{ matrix.architecture }}
      RPM_BUILD_NCPUS: '2'
    steps:
      - name: Prepare native Fedora tools
        run: dnf5 -y install git gh podman cpio curl patch rpm-build rpmdevtools dnf5-plugins python3 findutils glibc-langpack-en
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Admit already checked matching toolkit
        if: matrix.toolkit
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLKIT_RUN: ${{ inputs.toolkit_run }}
        run: |
          args=()
          if [ -n "$TOOLKIT_RUN" ]; then args+=(--run-id "$TOOLKIT_RUN"); fi
          python3 scripts/os/admit-desktop-toolkit.py --architecture "$LUMA_TARGET_ARCHITECTURE" "${args[@]}"
      - name: Build and check the selected component
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          test "$(rpm --eval '%{_arch}')" = "$LUMA_TARGET_ARCHITECTURE"
          mkdir -p build
          git -c safe.directory="$PWD" rev-parse HEAD > build/SOURCE-REVISION
          export SOURCE_DATE_EPOCH=$(git -c safe.directory="$PWD" log -1 --format=%ct HEAD)
          bash "$RECIPE"
      - name: Verify the noarch package identity and shipped payload
        id: package
        if: matrix.spec != ''
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          python3 scripts/os/check-native-noarch-package.py --spec "$SPEC"
          name=$(rpmspec --query --rpms --qf '%{NAME}' "$SPEC")
          echo "directory=build/packages/$name" >> "$GITHUB_OUTPUT"
      - name: Retain checked RPMs
        if: matrix.spec == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.component }}-${{ matrix.architecture }}
          path: |
            build/packages/**/RPMS/
            build/packages/**/SRPMS/
            build/packages/**/SHA256SUMS
            build/SOURCE-REVISION
          if-no-files-found: error
          retention-days: 14
      - name: Retain checked noarch component RPMs
        if: matrix.spec != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.component }}-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.directory }}/RPMS/
            ${{ steps.package.outputs.directory }}/SRPMS/
            ${{ steps.package.outputs.directory }}/SHA256SUMS
            build/SOURCE-REVISION
          if-no-files-found: error
          retention-days: 14
