name: Native desktop WebKit

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-webkit.yml'
      - 'scripts/packages/build-webkitgtk-luma.sh'
      - 'scripts/packages/run-in-rpm-builder.sh'
      - 'packaging/rpm/webkitgtk-luma.spec'
      - 'config/shared/webkitgtk-inputs.env'
      - 'config/desktop/inputs.env'
      - 'patches/webkitgtk/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: echo "needed=$(python3 scripts/os/desktop-ci-changed.py --component webkit --base "$BASE")" >> "$GITHUB_OUTPUT"
  build:
    needs: select
    if: needs.select.outputs.needed == 'true'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            image: registry.fedoraproject.org/fedora@sha256:69b1219730fe52d6cbb0874cbc1a36dd43b722354a603f6cdf73acbff8dd7c59
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            image: registry.fedoraproject.org/fedora@sha256:22dbf85bb441d15ebec58522f98636699b4dc722d89f19a3f01c8ed382695b57
    runs-on: ${{ matrix.runner }}
    env:
      LUMA_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
      LUMA_RPM_BUILDER_DIRECT: '1'
      RPM_BUILD_NCPUS: '4'
      LUMA_WEBKIT_DWZ: '0'
      LUMA_WEBKIT_KEEP_FAILED_WORK: '1'
      BUILDER_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare scratch on the disposable hosted worker
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h "$GITHUB_WORKSPACE"
          # These are unused preinstalled SDKs in this fresh hosted VM.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          available=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          test "$available" -ge 34359738368 || { echo 'WebKit needs at least 32 GiB of scratch on this worker'; exit 1; }
      - name: Build and check the shared WebKit providers
        timeout-minutes: 330
        run: |
          container_name="luma-webkit-$LUMA_TARGET_ARCHITECTURE-$GITHUB_RUN_ID"
          trap 'docker stop --time 30 "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --rm --name "$container_name" --cpus=4 --memory=14g --pids-limit=2048 \
            --env LUMA_TARGET_ARCHITECTURE --env LUMA_RPM_BUILDER_DIRECT \
            --env RPM_BUILD_NCPUS --env LUMA_WEBKIT_DWZ --env LUMA_WEBKIT_KEEP_FAILED_WORK --env BUILDER_IMAGE \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$BUILDER_IMAGE" bash -euo pipefail -c '
              dnf5 -y install git podman cpio curl patch rpm-build rpmdevtools dnf5-plugins python3 findutils glibc-langpack-en
              test "$(rpm --eval "%{_arch}")" = "$LUMA_TARGET_ARCHITECTURE"
              . config/desktop/inputs.env
              case "$LUMA_TARGET_ARCHITECTURE" in
                x86_64) test "$BUILDER_IMAGE" = "$FEDORA_RPM_BUILD_CONTAINER" ;;
                aarch64) test "$BUILDER_IMAGE" = "$FEDORA_RPM_BUILD_CONTAINER_AARCH64" ;;
              esac
              mkdir -p build
              git -c safe.directory="$PWD" rev-parse HEAD > build/SOURCE-REVISION
              bash scripts/packages/build-webkitgtk-luma.sh
            '
      - name: Preserve an unqualified failed-build checkpoint
        if: failure()
        timeout-minutes: 20
        run: |
          shopt -s nullglob
          workspaces=(build/webkitgtk.work.*)
          test "${#workspaces[@]}" -gt 0
          # Never publish this as a package or skip normal RPM checks on reuse.
          sudo tar -cf - -- "${workspaces[@]}" build/SOURCE-REVISION | \
            zstd -T2 -1 --memory=512MB -o build/UNQUALIFIED-webkit-checkpoint.tar.zst
          sha256sum build/UNQUALIFIED-webkit-checkpoint.tar.zst > build/UNQUALIFIED-webkit-checkpoint.sha256
      - name: Retain the unqualified checkpoint separately
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNQUALIFIED-webkit-checkpoint-${{ matrix.architecture }}
          path: |
            build/UNQUALIFIED-webkit-checkpoint.tar.zst
            build/UNQUALIFIED-webkit-checkpoint.sha256
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
      - name: Retain checked WebKit packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-webkit-${{ matrix.architecture }}
          path: |
            build/packages/**/RPMS/
            build/packages/**/SRPMS/
            build/packages/**/SHA256SUMS
            build/packages/**/ADMITTED-RESOURCE-OPTIONS.txt
            build/packages/**/ADMITTED-LINKER-PROOF.txt
            build/packages/**/ADMITTED-INPUT-SHA256SUMS
            build/SOURCE-REVISION
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
